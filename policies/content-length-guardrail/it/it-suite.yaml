# The integration suite of the content-length-guardrail policy. Feature paths are relative to this
# directory. Give a runner a tags entry, "gateway-version>=X.Y.Z", only when the policy needs a
# gateway release newer than the oldest one tested.

suite: content-length-guardrail

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: content-length-guardrail
    parallel: 4
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: content-length-guardrail
        features:
          - features/content_length_guardrail.feature
      - name: content-length-guardrail-streaming
        tags: "~@known-issue"
        features:
          - features/content_length_guardrail_streaming.feature
      - name: content-length-guardrail-measurement
        features:
          - features/content_length_guardrail_measurement.feature
      - name: content-length-guardrail-configuration
        features:
          - features/content_length_guardrail_configuration.feature
      - name: content-length-guardrail-violations
        features:
          - features/content_length_guardrail_violations.feature
      - name: content-length-guardrail-invalid-settings
        features:
          - features/content_length_guardrail_invalid_settings.feature
      - name: content-length-guardrail-validation
        features:
          - features/content_length_guardrail_validation.feature
