# The integration suite of the remove-headers policy. Feature paths are relative to this directory.
# Give a runner a tags entry, "gateway-version>=X.Y.Z", only when the policy needs a gateway release
# newer than the oldest one tested.

suite: remove-headers

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  # Runners stay one at a time: the restart runner restarts the block's gateway, which would
  # interrupt the others, and the lifecycle runner reads the block's shared service logs.
  - name: remove-headers
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: remove-headers-request
        features:
          - features/remove_headers_request.feature
      - name: remove-headers-response
        features:
          - features/remove_headers_response.feature
      - name: remove-headers-matching
        features:
          - features/remove_headers_matching.feature
      - name: remove-headers-scope
        tags: "gateway-version>=1.2.0"
        features:
          - features/remove_headers_scope.feature
      # Gateway 1.1.0 gives policies the request headers as earlier policies left them, not the
      # client's snapshot (wso2/api-platform#2548, fixed in 1.2.0), so the scenarios tagged
      # @known-issue-gw-1.1.0 are skipped there.
      - name: remove-headers-scope-gw-1.1.0
        tags: "gateway-version<1.2.0;~@known-issue-gw-1.1.0"
        features:
          - features/remove_headers_scope.feature
      - name: remove-headers-lifecycle
        features:
          - features/remove_headers_lifecycle.feature
      - name: remove-headers-validation
        features:
          - features/remove_headers_validation.feature
      - name: remove-headers-restart
        features:
          - features/remove_headers_restart.feature
