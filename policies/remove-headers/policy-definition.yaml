name: remove-headers
version: v0.1.0
description: |
  Removes headers from request and/or response messages by case-insensitive header name.
  Missing headers are ignored without failing the request.

parameters:
  type: object
  properties:
    requestHeaders:
      type: array
      description: Request header names to remove during the request phase. At least
        one of requestHeaders or responseHeaders must be specified.
      minItems: 1
      items:
        type: object
        properties:
          name:
            type: string
            description: Header name (case-insensitive)
            minLength: 1
            maxLength: 256
            pattern: "^[a-zA-Z0-9-_]+$"
        required:
        - name
    responseHeaders:
      type: array
      description: Response header names to remove during the response phase. At
        least one of requestHeaders or responseHeaders must be specified.
      minItems: 1
      items:
        type: object
        properties:
          name:
            type: string
            description: Header name (case-insensitive)
            minLength: 1
            maxLength: 256
            pattern: "^[a-zA-Z0-9-_]+$"
        required:
        - name
  anyOf:
    - required: [ requestHeaders ]
    - required: [ responseHeaders ]

systemParameters:
  type: object
  properties: {}
