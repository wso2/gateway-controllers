# The policy reads its embedding provider from its own section, not from the root
# embedding_provider_* keys the other semantic policies share.
[policy_configurations.semantic_model_routing_v1]
embedding_provider = "OPENAI"
embedding_provider_endpoint = "http://testbench:3004/v1/embeddings"
embedding_provider_model = "text-embedding-ada-002"
embedding_provider_api_key = "test-api-key"
