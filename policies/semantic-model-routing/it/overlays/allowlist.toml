# The testbench Azure OpenAI deployment and a key, but APIs may use only workload identity, and only
# that deployment's resource.
[policy_configurations.semantic_model_routing_v1]
embedding_provider = "AZURE_OPENAI"
embedding_provider_endpoint = "http://testbench:3004/openai/deployments/text-embedding/embeddings?api-version=2024-10-21"
embedding_provider_model = "text-embedding-ada-002"
embedding_provider_api_key = "test-api-key"
embedding_provider_allowed_auth_types = ["workload-identity"]
embedding_provider_allowed_endpoints = ["http://testbench:3004"]
