name: semantic-model-routing
version: v0.10.0
description: |
  Routes AI/LLM requests to different models based on semantic similarity
  between the user request and predefined utterances. On startup, embeddings
  are precomputed for all configured utterances. At runtime, the user request
  is embedded and compared using cosine similarity. If the best match exceeds
  the configured score threshold, the request is routed to that model;
  otherwise it falls back to the default model.

parameters:
  type: object
  propertyNames:
    not:
      enum: [embeddingAllowedAuthTypes, embeddingAllowedEndpoints]
  properties:
    contentPath:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        JSONPath expression to extract the user request text from the
        request payload for embedding generation.
      default: "$.messages[-1].content"
    routes:
      type: array
      x-wso2-policy-advanced-param: false
      description: |
        List of semantic routes. Each route defines a target model, a list
        of sample utterances for embedding, and an optional similarity
        score threshold.
      items:
        type: object
        properties:
          provider:
            type: string
            description: |
              Optional destination provider. Use the LlmProxy additionalProviders[].as
              alias, or provider id when as is absent. Empty or omitted preserves
              the current upstream (normally the primary provider).
          model:
            type: string
            description: Target AI model name to route matching requests to.
            minLength: 1
          utterances:
            type: array
            description: |
              Sample phrases representing requests that should route to
              this model. Embeddings are precomputed at policy init time.
            items:
              type: string
              minLength: 1
            minItems: 1
          scorethreshold:
            type: number
            description: |
              Minimum cosine similarity score (0.0 to 1.0) required to
              route to this model. Defaults to 0.90.
            minimum: 0.0
            maximum: 1.0
            default: 0.90
        required:
          - model
          - utterances
      minItems: 1
    defaultProvider:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        Optional destination provider used with defaultModel on fallback.
        Uses the same alias rules as each route's provider. It is not inherited
        by matched routes that omit provider.
    defaultModel:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        The model to use when no route's similarity score exceeds its
        threshold.
      minLength: 1
    azureAuth:
      type: object
      x-wso2-policy-advanced-param: true
      additionalProperties: false
      description: |
        How this API's embedding calls authenticate to Azure OpenAI. Omit it to
        send the API key. The identity types need the AZURE_OPENAI embedding
        provider. The gateway's
        policy_configurations.semantic_model_routing_v1.embedding_provider_allowed_auth_types
        can limit the types an API may use.
      properties:
        authenticationType:
          type: string
          x-wso2-policy-advanced-param: false
          description: |
            "api-key", the default, sends the API key: the API's apiKey, or the
            gateway's
            policy_configurations.semantic_model_routing_v1.embedding_provider_api_key.
            The other types send a Microsoft Entra ID access token for the
            gateway's Azure identity instead, and need the AZURE_OPENAI embedding
            provider.
            "workload-identity" uses AKS Workload Identity: the gateway pod runs
            with a service account federated with a Microsoft Entra ID identity.
            "managed-identity" uses a managed identity of the host the gateway
            runs on, from the Azure Instance Metadata Service of a VM, VM scale
            set or AKS node. "container-apps" uses a managed identity of the
            Azure Container Apps app the gateway runs in. The identity needs the
            Cognitive Services OpenAI User role on the Azure OpenAI resource.
          enum:
            - api-key
            - workload-identity
            - managed-identity
            - container-apps
          default: api-key
        clientId:
          type: string
          x-wso2-policy-advanced-param: false
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          description: |
            Application (client) ID of the identity, for the Azure identity
            types. With workload-identity, defaults to AZURE_CLIENT_ID. With
            managed-identity or container-apps, selects a user-assigned identity;
            leave it unset for the host's or app's system-assigned identity.
            Ignored with api-key, but a value that is set must still be a GUID.
        scope:
          type: string
          x-wso2-policy-advanced-param: false
          pattern: "^\\S+/\\.default$"
          description: |
            Scope of the access token, for the Azure identity types. Defaults to
            "https://cognitiveservices.azure.com/.default". Ignored with api-key,
            but a value that is set must still end in /.default.
  required:
    - routes
    - defaultModel

systemParameters:
  type: object
  properties:
    embeddingProvider:
      type: string
      description: |
        Embedding provider type: "OPENAI", "MISTRAL", "AZURE_OPENAI"
      enum:
        - OPENAI
        - MISTRAL
        - AZURE_OPENAI
      "wso2/defaultValue": "${config.policy_configurations.semantic_model_routing_v1.embedding_provider}"
    embeddingEndpoint:
      type: string
      description: |
        Endpoint URL for the embedding service.
        For OpenAI: "https://api.openai.com/v1/embeddings"
        For Mistral: "https://api.mistral.ai/v1/embeddings"
        For Azure OpenAI: Azure OpenAI endpoint URL
      minLength: 1
      "wso2/defaultValue": "${config.policy_configurations.semantic_model_routing_v1.embedding_provider_endpoint}"
    embeddingModel:
      type: string
      description: |
        Embedding model name (required for OPENAI and MISTRAL; not required
        for AZURE_OPENAI where the deployment name is in the endpoint URL).
      "wso2/defaultValue": "${config.policy_configurations.semantic_model_routing_v1.embedding_provider_model}"
    apiKey:
      type: string
      description: |
        API key for the embedding provider. Required in api-key mode, for every
        provider: every API whose azureAuth.authenticationType is api-key, the
        default, sends it unless the API has its own. Not needed when every API
        uses an Azure identity.
      minLength: 1
      "wso2/defaultValue": "${config.policy_configurations.semantic_model_routing_v1.embedding_provider_api_key}"
    embeddingAllowedAuthTypes:
      type: array
      items:
        type: string
        enum:
          - api-key
          - workload-identity
          - managed-identity
          - container-apps
      description: |
        If non-empty, the authentication types this gateway's APIs may choose
        in azureAuth.authenticationType. An API without azureAuth uses api-key
        and is checked as such. Leave out api-key to stop APIs sending the key;
        list only api-key to keep them off the gateway's Azure identities. Empty
        (the default) places no limit.
      "wso2/defaultValue": "${config.policy_configurations.semantic_model_routing_v1.embedding_provider_allowed_auth_types}"
    embeddingAllowedEndpoints:
      type: array
      items:
        type: string
      description: |
        If non-empty, the embedding resources this gateway's APIs may call,
        including the resource of the gateway's own
        policy_configurations.semantic_model_routing_v1.embedding_provider_endpoint.
        Entries are resource URLs, such as https://<resource>.openai.azure.com,
        with no path, query or fragment. They are matched on scheme, host and
        port, ignoring case, against the endpoint an API uses, its own or the
        gateway's, so the gateway's key and tokens for its Azure identity are
        only sent to listed resources. Any deployment on a listed resource is
        allowed. Empty (the default) places no limit.
      "wso2/defaultValue": "${config.policy_configurations.semantic_model_routing_v1.embedding_provider_allowed_endpoints}"
    requestModel:
      type: object
      description: |
        Specifies where the model name appears in the request so the policy
        can replace it with the selected model.
      properties:
        location:
          type: string
          enum:
            - payload
        identifier:
          type: string
          description: |
            JSONPath expression identifying the model field in the request payload.
      required:
        - location
        - identifier
  required:
    - embeddingProvider
    - embeddingEndpoint
    - requestModel
