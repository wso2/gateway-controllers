name: semantic-tool-filtering
version: v1.1.0
description: |
  Dynamically filters the tools provided within an API request based on their semantic relevance to the
  user query. This policy extracts both the query and the tool definitions from the incoming payload,
  generates an embedding for the query, and performs a similarity search against the provided tools.
  It then replaces the original 'tools' array with a filtered subset, optimizing the request before it reaches the LLM.
  
  Note: This policy requires embedding providers (OpenAI, Mistral, Azure OpenAI) to be configured.

parameters:
  type: object
  propertyNames:
    not:
      enum: [embeddingAllowedAuthTypes, embeddingAllowedEndpoints]
  properties:
    selectionMode:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        Method used to filter tools:
        - "By Rank": Selects a fixed number of the most relevant tools.
        - "By Threshold": Selects all tools exceeding a specific similarity score.
      enum:
        - By Rank
        - By Threshold
      default: "By Rank"
    limit:
      type: integer
      x-wso2-policy-advanced-param: true
      description: "The number of most relevant tools to include (used if selectionMode is By Rank)."
      minimum: 0
      maximum: 20
      default: 5
    threshold:
      type: number
      x-wso2-policy-advanced-param: true
      description: |
        Similarity threshold for filtering (0.0 to 1.0). 
        Only tools with a score above this value are included (used if selectionMode is By Threshold).
      minimum: 0.0
      maximum: 1.0
      default: 0.7
    queryJSONPath:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        JSONPath expression to extract the user's query from the request body.
        Example: "$.messages[-1].content"
      default: "$.messages[-1].content"
    toolsJSONPath:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        JSONPath expression to extract the tools definition from the request body (used when toolsIsJson is true).
        This can point to the tools array itself (for example, "$.tools") or to the iterated
        object inside each array item using a single wildcard (for example, "$.tools[*].function").
      default: "$.tools"
      pattern: '^\$\.([A-Za-z_][A-Za-z0-9_]*(\[(\d+|\*)\])?\.)*[A-Za-z_][A-Za-z0-9_]*(\[(\d+|\*)\])?$'
    userQueryIsJson:
      type: boolean
      x-wso2-policy-advanced-param: true
      description: |
        Specifies the format of user query extraction:
        - true: Extract user query using query JSON path from queryJSONPath parameter
        - false: Extract user query from text using <userq>...</userq> tags
      default: true
    toolsIsJson:
      type: boolean
      x-wso2-policy-advanced-param: true
      description: |
        Specifies the format of tools definition:
        - true: Extract tools using tools JSON path from toolsJSONPath parameter (JSON format)
        - false: Extract tools from text using <toolname>...</toolname> and <tooldescription>...</tooldescription> tags
        
        Text format example:
        <toolname>get_weather</toolname>
        <tooldescription>Get current weather for a location</tooldescription>
        <toolname>search_web</toolname>
        <tooldescription>Search the web for information</tooldescription>
      default: true
    azureAuth:
      type: object
      x-wso2-policy-advanced-param: true
      additionalProperties: false
      description: |
        How this API's embedding calls authenticate to Azure OpenAI. Omit it to
        send the API key. The identity types need the AZURE_OPENAI embedding
        provider. The gateway's embedding_provider_allowed_auth_types can limit
        the types an API may use.
      properties:
        authenticationType:
          type: string
          x-wso2-policy-advanced-param: false
          description: |
            "api-key", the default, sends the API key: the API's apiKey, or the
            gateway's embedding_provider_api_key. The other types send a
            Microsoft Entra ID access token for the gateway's Azure identity
            instead, and need the AZURE_OPENAI embedding provider.
            "workload-identity" uses AKS Workload Identity: the gateway pod runs
            with a service account federated with a Microsoft Entra ID identity.
            "managed-identity" uses a managed identity of the host the gateway
            runs on, from the Azure Instance Metadata Service of a VM, VM scale
            set or AKS node. "container-apps" uses a managed identity of the
            Azure Container Apps app the gateway runs in. The identity needs the
            Cognitive Services OpenAI User role on the Azure OpenAI resource.
          enum:
            - api-key
            - workload-identity
            - managed-identity
            - container-apps
          default: api-key
        clientId:
          type: string
          x-wso2-policy-advanced-param: false
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          description: |
            Application (client) ID of the identity, for the Azure identity
            types. With workload-identity, defaults to AZURE_CLIENT_ID. With
            managed-identity or container-apps, selects a user-assigned identity;
            leave it unset for the host's or app's system-assigned identity.
            Ignored with api-key.
        scope:
          type: string
          x-wso2-policy-advanced-param: false
          pattern: "^\\S+/\\.default$"
          description: |
            Scope of the access token, for the Azure identity types. Defaults to
            "https://cognitiveservices.azure.com/.default". Ignored with api-key.
  required:
    - selectionMode

systemParameters:
  type: object
  x-wso2-policy-advanced-param: true
  properties:
    embeddingProvider:
      type: string
      description: "Embedding provider: OPENAI, MISTRAL, or AZURE_OPENAI"
      enum:
        - OPENAI
        - MISTRAL
        - AZURE_OPENAI
      "wso2/defaultValue": "${config.embedding_provider}"
    embeddingEndpoint:
      type: string
      description: "Endpoint URL for the embedding service"
      "wso2/defaultValue": "${config.embedding_provider_endpoint}"
      minLength: 1
    embeddingModel:
      type: string
      description: "Model name (e.g., text-embedding-3-small or mistral-embed)"
      "wso2/defaultValue": "${config.embedding_provider_model}"
    apiKey:
      type: string
      description: |
        API key for the embedding provider. Required in api-key mode, for every
        provider: every API whose azureAuth.authenticationType is api-key, the
        default, sends it unless the API has its own. Not needed when every API
        uses an Azure identity.
      "wso2/defaultValue": "${config.embedding_provider_api_key}"
      minLength: 1
    embeddingAllowedAuthTypes:
      type: array
      items:
        type: string
        enum:
          - api-key
          - workload-identity
          - managed-identity
          - container-apps
      description: |
        If non-empty, the authentication types this gateway's APIs may choose
        in azureAuth.authenticationType. An API without azureAuth uses api-key
        and is checked as such. Leave out api-key to stop APIs sending the key;
        list only api-key to keep them off the gateway's Azure identities. Empty
        (the default) places no limit.
      "wso2/defaultValue": "${config.embedding_provider_allowed_auth_types}"
    embeddingAllowedEndpoints:
      type: array
      items:
        type: string
      description: |
        If non-empty, the embedding resources this gateway's APIs may call,
        including the gateway's own embedding_provider_endpoint. Entries are
        resource URLs, such as https://<resource>.openai.azure.com, with no
        path, query or fragment. They are matched on scheme, host and port,
        ignoring case, against the endpoint an API uses, its own or the
        gateway's, so the gateway's key and tokens for its Azure identity are
        only sent to listed resources. Any deployment on a listed resource is
        allowed. Empty (the default) places no limit.
      "wso2/defaultValue": "${config.embedding_provider_allowed_endpoints}"
  required:
    - embeddingProvider
    - embeddingEndpoint
