name: mcp-rewrite
version: v0.1.0
description: |
  Rewrites MCP tools, resources, and prompts between client-facing names and backend targets.
  Can filter list responses and rewrite request payloads based on configured entries.
  Omitted lists allow all, empty lists deny all, and non-empty lists allow only configured items.

parameters:
  type: object
  additionalProperties: false
  properties:
    tools:
      type: array
      description: |
        Tool rewrite entries.
        When non-empty, only listed tools are exposed in `tools/list`.
      items:
        type: object
        additionalProperties: true
        required:
          - name
          - description
          - inputSchema
        properties:
          name:
            type: string
            description: User-facing tool name exposed to clients.
            minLength: 1
            maxLength: 256
          description:
            type: string
            description: User-facing tool description returned in tools/list.
            minLength: 1
          inputSchema:
            type: string
            description: Tool input schema returned in tools/list.
            minLength: 1
          outputSchema:
            type: string
            description: Tool output schema returned in tools/list.
            minLength: 1
          target:
            type: string
            description: Backend tool name to use when forwarding requests.
            minLength: 1
            maxLength: 256
    resources:
      type: array
      description: |
        Resource rewrite entries.
        When non-empty, only listed resources are exposed in `resources/list`.
      items:
        type: object
        additionalProperties: true
        required:
          - name
          - uri
        properties:
          name:
            type: string
            description: User-facing resource identifier (URI) exposed to clients.
            minLength: 1
            maxLength: 1024
          description:
            type: string
            description: User-facing resource description returned in resources/list.
            minLength: 1
          uri:
            type: string
            description: User-facing resource URI returned in resources/list.
            minLength: 1
            maxLength: 2048
          target:
            type: string
            description: Backend resource identifier (URI) to use when forwarding requests.
            minLength: 1
            maxLength: 1024
    prompts:
      type: array
      description: |
        Prompt rewrite entries.
        When non-empty, only listed prompts are exposed in `prompts/list`.
      items:
        type: object
        additionalProperties: true
        required:
          - name
        properties:
          name:
            type: string
            description: User-facing prompt name exposed to clients.
            minLength: 1
            maxLength: 256
          description:
            type: string
            description: User-facing prompt description returned in prompts/list.
            minLength: 1
          target:
            type: string
            description: Backend prompt name to use when forwarding requests.
            minLength: 1
            maxLength: 256

systemParameters:
  type: object
  properties: {}
