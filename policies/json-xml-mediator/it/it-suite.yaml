# The integration suite of the json-xml-mediator policy. Feature paths are relative to this
# directory. Give a runner a tags entry, "gateway-version>=X.Y.Z", only when the policy needs a
# gateway release newer than the oldest one tested.

suite: json-xml-mediator

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  # Each scenario creates its own API, and capture records under paths that begin with the API's
  # name, so every runner runs at the same time.
  - name: json-xml-mediator
    parallel: 5
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: json-xml-mediator
        tags: "~@known-issue"
        features:
          - features/json_xml_mediator.feature
      - name: json-xml-mediator-response
        tags: "~@known-issue"
        features:
          - features/json_xml_mediator_response.feature
      - name: json-xml-mediator-validation
        features:
          - features/json_xml_mediator_validation.feature
      - name: json-xml-mediator-api-lifecycle
        features:
          - features/json_xml_mediator_api_lifecycle.feature
      - name: json-xml-mediator-security
        features:
          - features/json_xml_mediator_security.feature

  # Restarting the gateway runtime or controller would interrupt the other runners, so the restart
  # scenarios run in a block of their own, one runner at a time.
  - name: json-xml-mediator-restart
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: json-xml-mediator-restart
        features:
          - features/json_xml_mediator_restart.feature
