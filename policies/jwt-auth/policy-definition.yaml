name: jwt-auth
version: v1.3.1
description: |
  Validates JWT access tokens included in API requests. The gateway verifies the
  token's signature, expiry, issuer, audience, scopes, and required claims.

parameters:
  type: object
  additionalProperties: false
  properties:
    issuers:
      type: array
      x-wso2-policy-advanced-param: true
      description: >-
        Specifies issuer names for token validation by referencing entries in
        `system.keyManagers`. If omitted, runtime matches by token `iss` or
        tries all configured providers.
      default: []
      items:
        type: string

    audiences:
      type: array
      x-wso2-policy-advanced-param: true
      description: Specifies accepted audience values. Token validation succeeds only when at least one configured audience is present.
      default: []
      items:
        type: string

    requiredScopes:
      type: array
      x-wso2-policy-advanced-param: true
      x-wso2-policy-deprecated-param: true
      description: >-
        DEPRECATED — use `scopes` (allOf/anyOf) instead. Specifies scopes to check against the
        token's `scope` (space-delimited) or `scp` (array) claims; at least one of the listed
        scopes must be present. Ignored when `scopes` is configured.
      default: []
      items:
        type: string

    requiredClaims:
      type: object
      x-wso2-policy-advanced-param: true
      x-wso2-policy-deprecated-param: true
      description: >-
        DEPRECATED — use `claims` (allOf/anyOf) instead. Specifies required claim-value pairs as
        `claimName -> expectedValue`; every pair must match. Ignored when `claims` is configured.
      default: {}
      additionalProperties:
        type: string

    scopes:
      type: object
      x-wso2-policy-advanced-param: true
      additionalProperties: false
      description: >-
        Scope requirements evaluated against the token's scopes. `allOf` requires every listed
        scope to be present; `anyOf` requires at least one. When both are given they are AND-ed:
        (all of allOf) AND (any of anyOf). Takes precedence over the deprecated `requiredScopes`.
      default: {}
      properties:
        allOf:
          type: array
          description: All listed scopes must be present in the token.
          items:
            type: string
        anyOf:
          type: array
          description: At least one of the listed scopes must be present in the token.
          items:
            type: string

    claims:
      type: object
      x-wso2-policy-advanced-param: true
      additionalProperties: false
      description: >-
        Claim requirements evaluated against the token's claims. `allOf` requires every matcher to
        match; `anyOf` requires at least one. When both are given they are AND-ed. Each matcher
        names a claim and a list of accepted values; the matcher is satisfied when the token's
        claim value is one of those values (for a multi-valued claim, any overlap). Takes
        precedence over the deprecated `requiredClaims`.
      default: {}
      properties:
        allOf:
          type: array
          description: Every matcher must be satisfied.
          items:
            type: object
            additionalProperties: false
            required: ["claim", "values"]
            properties:
              claim:
                type: string
                description: Name of the token claim to evaluate.
              values:
                type: array
                minItems: 1
                description: Accepted values; the matcher is satisfied when the claim's value is one of these.
                items:
                  type: string
        anyOf:
          type: array
          description: At least one matcher must be satisfied.
          items:
            type: object
            additionalProperties: false
            required: ["claim", "values"]
            properties:
              claim:
                type: string
                description: Name of the token claim to evaluate.
              values:
                type: array
                minItems: 1
                description: Accepted values; the matcher is satisfied when the claim's value is one of these.
                items:
                  type: string

    claimMappings:
      type: object
      x-wso2-policy-advanced-param: true
      description: Specifies claim-to-output mappings as `claimName -> headerOrContextKey` for downstream use.
      default: {}
      additionalProperties:
        type: string

    authHeaderPrefix:
      type: string
      x-wso2-policy-advanced-param: true
      description: Specifies a route-level authorization scheme prefix (for example, "Bearer" or "JWT") that overrides `system.authHeaderScheme`.
      default: Bearer

    userIdClaim:
      type: string
      x-wso2-policy-advanced-param: true
      description: >-
        Specifies the claim name used to extract the user ID for analytics.
        Defaults to "sub" when omitted.
      default: sub

    headerName:
      type: string
      x-wso2-policy-advanced-param: true
      minLength: 1
      pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
      description: Header name to extract token from (for example "Authorization") that overrides `system.headerName`.
      default: Authorization

    forwardToken:
      type: boolean
      x-wso2-policy-advanced-param: true
      description: >-
        If true, the original Authorization header (containing the JWT) is
        forwarded to the upstream service after successful validation. If
        false, the header is stripped before the request is proxied.
      default: true

    forwardedTokenHeader:
      type: string
      x-wso2-policy-advanced-param: true
      minLength: 1
      pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
      description: >-
        The header name used to forward the JWT to the upstream service when
        `forwardToken` is true. If this differs from `headerName`, the original
        header is removed and the token is forwarded under this name instead. By
        default the full Authorization header value (including the scheme prefix)
        is forwarded; set `forwardTokenStripScheme` to true to forward only the bare
        token value. Has no effect when `forwardToken` is false.
      default: x-forwarded-authorization

    forwardTokenStripScheme:
      type: boolean
      x-wso2-policy-advanced-param: true
      description: >-
        Controls what is forwarded under `forwardedTokenHeader` when
        `forwardToken` is true. If true, only the bare token value (with the
        scheme prefix such as "Bearer" stripped) is forwarded. If false (the
        default), the full Authorization header value including the prefix is
        forwarded. Has no effect when `forwardToken` is false.
      default: false

systemParameters:          
  type: object
  additionalProperties: false
  properties:
    keyManagers:
      type: array
      description: >-
        List of key manager definitions. Each entry must include a unique `name` 
        and either `jwks` (for remote JWKS or local certificates) configuration.
      items:
        type: object
        additionalProperties: false
        required: ["name"]
        properties:
          name:
            type: string
            description: Unique name for this key manager/provider (used in `user.issuers`).
          issuer:
            type: string
            description: Optional issuer (iss) value associated with keys from this provider.
          scopeClaim:
            type: string
            description: >-
              Optional token claim from which scopes are read for tokens verified by this key
              manager. When omitted, scopes are read from both the space-delimited `scope` string
              claim and the `scp` array claim (the default behavior).
          scopeClaimSeparator:
            type: string
            description: >-
              Separator used to split a string-valued `scopeClaim` into individual scopes.
              Defaults to a single space (" ") when omitted. Ignored when `scopeClaim` resolves to
              an array claim. Has no effect unless `scopeClaim` is set.
          jwks:
            type: object
            description: JWKS configuration supporting both remote endpoints and local certificates. Either 'remote' or 'local' must be specified, but not both.
            additionalProperties: false
            oneOf:
              - required: ["remote"]
                not:
                  required: ["local"]
              - required: ["local"]
                not:
                  required: ["remote"]
            properties:
              remote:
                type: object
                description: Remote JWKS endpoint configuration. The 'uri' field is required.
                additionalProperties: false
                required: ["uri"]
                properties:
                  uri:
                    type: string
                    format: uri
                    description: JWKS endpoint URL (e.g., https://idp.example/.well-known/jwks.json).
                  certificatePath:
                    type: string
                    description: Optional path to CA certificate file for validating self-signed JWKS endpoints (e.g., /etc/certs/ca.pem).
                  skipTlsVerify:
                    type: boolean
                    default: false
                    description: If true, skip TLS certificate verification for the JWKS endpoint. Use with caution, only for testing or trusted internal endpoints.
              local:
                type: object
                description: Local certificate configuration for signature verification. Either 'inline' or 'certificatePath' must be provided, but not both.
                additionalProperties: false
                oneOf:
                  - required: ["inline"]
                    not:
                      required: ["certificatePath"]
                  - required: ["certificatePath"]
                    not:
                      required: ["inline"]
                properties:
                  inline:
                    type: string
                    description: Inline PEM-encoded certificate or public key for signature verification.
                  certificatePath:
                    type: string
                    description: Path to certificate or public key file (e.g., /etc/certs/public.pem).
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.keymanagers}"

    jwksCacheTtl:
      type: string
      description: Duration string for JWKS caching (e.g., "5m"). If omitted a default is used.
      default: "5m"
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.jwkscachettl}"

    tokenCaching:
      type: boolean
      description: >-
        Whether to cache token verification verdicts. When true (default), a signature-verified
        token skips re-verification (unverified parsing, key manager/certificate parsing, and
        signature checking) on repeat presentation, and a deterministically invalid token
        (expired or malformed) is also cached so repeated bad tokens are rejected without
        re-verification. Caching a successful verdict means a revoked token may still be
        accepted for up to tokenCacheTtl after it was last verified; set to false to force full
        verification on every request.
      default: true
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.tokencaching}"

    tokenCacheTtl:
      type: string
      description: >-
        Maximum duration a successfully verified token is trusted from cache (e.g., "5m"). The
        actual cache expiry is the sooner of this value and the token's own exp claim (minus
        leeway), so this bounds how long a revoked token may still be accepted after its last
        verification.
      default: "5m"
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.tokencachettl}"

    negativeCacheTtl:
      type: string
      description: >-
        Duration a deterministically invalid verification verdict (expired or malformed token
        only) is cached before re-verification is attempted again (e.g., "30s"). Kept short
        since this is purely a DoS/retry-absorption optimization; transient failures (e.g. JWKS
        fetch errors) and not-yet-valid (nbf) tokens are never cached, since they may resolve on
        a later attempt.
      default: "30s"
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.negativecachettl}"

    cacheMaxSize:
      type: integer
      description: >-
        Maximum total number of cached verification verdicts (successful and failed, combined)
        to hold across all APIs (a single global bound, not per-API). Entries themselves are
        shared across APIs when their verification config (key managers, issuer validation,
        issuers, leeway) matches, so a token presented to many APIs occupies one entry, not one
        per API, stretching this budget further. When the limit is reached, the cache evicts the
        least-recently-used existing entries to make room. Changing this value rebuilds the
        shared cache, which flushes all currently cached verdicts.
      default: 100000
      minimum: 1
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.cachemaxsize}"

    jwksFetchTimeout:
      type: string
      description: Timeout for HTTP fetch of JWKS, e.g., "5s".
      default: "5s"
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.jwksfetchtimeout}"

    jwksFetchRetryCount:
      type: integer
      description: Number of retries for JWKS fetch on transient failures.
      default: 3
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.jwksfetchretrycount}"

    jwksFetchRetryInterval:
      type: string
      description: Interval between JWKS fetch retries, e.g., "2s".
      default: "2s"
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.jwksfetchretryinterval}"

    leeway:
      type: string
      description: Clock skew allowance for exp/nbf checks, e.g., "30s".
      default: "30s"
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.leeway}"

    authHeaderScheme:
      type: string
      description: Expected scheme prefix in the authorization header (e.g., "Bearer"). If set, runtime enforces the scheme; if omitted, runtime may accept raw header values or strip known schemes.
      default: Bearer
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.authheaderscheme}"

    headerName:
      type: string
      minLength: 1
      pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
      description: Header name to extract token from (default "Authorization").
      default: Authorization
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.headername}"

    onFailureStatusCode:
      type: integer
      description: HTTP status code to return on authentication failure (401 for Unauthorized, 403 for Forbidden).
      default: 401
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.onfailurestatuscode}"

    errorMessageFormat:
      type: string
      description: Format of error response on JWT validation failure. Supported values are "json" (structured error), "plain" (plain text), or "minimal" (minimal response).
      default: json
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.errormessageformat}"
    
    errorMessage:
      type: string
      description: Custom error message to include in the response body on authentication failure.
      default: "Authentication failed"
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.errormessage}"

    validateIssuer:
      type: boolean
      description: Whether to validate the token's issuer claim against configured key managers.
      default: true
      "wso2/defaultValue": "${config.policy_configurations.jwtauth_v1.validateissuer}"

  required: ["keyManagers"]
