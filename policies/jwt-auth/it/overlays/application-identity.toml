# The gateway of the jwt-auth-application-identity block. Every key manager here shares the
# testbench issuer and keys; an API picks one with the issuers parameter.

# Embeddings and the vector store for semantic-cache. Root-level keys come before the first table.
embedding_provider = "OPENAI"
embedding_provider_endpoint = "http://testbench:3004/v1/embeddings"
embedding_provider_model = "text-embedding-ada-002"
embedding_provider_dimension = 1536
embedding_provider_api_key = "test-api-key"

vector_db_provider = "REDIS"
vector_db_provider_host = "redis"
vector_db_provider_port = 6379
vector_db_provider_username = "default"
vector_db_provider_password = '{{ env "REDIS_PASSWORD" }}'
vector_db_provider_database = "0"
vector_db_provider_ttl = 3600

# No applicationIdClaim: sets no application identity, as jwt-auth v1.4 did.
[[policy_configurations.jwtauth_v1.keymanagers]]
name = "mock-jwks"
issuer = "http://testbench:3001/token"

[policy_configurations.jwtauth_v1.keymanagers.jwks.remote]
uri = "http://testbench:3001/jwks"

# Reads the application identity from client_id.
[[policy_configurations.jwtauth_v1.keymanagers]]
name = "mock-jwks-appid"
issuer = "http://testbench:3001/token"
applicationIdClaim = "client_id"

[policy_configurations.jwtauth_v1.keymanagers.jwks.remote]
uri = "http://testbench:3001/jwks"

# Reads the application identity from wso2_app_id, so a scenario can show that each key manager
# reads only its own claim.
[[policy_configurations.jwtauth_v1.keymanagers]]
name = "mock-jwks-wso2appid"
issuer = "http://testbench:3001/token"
applicationIdClaim = "wso2_app_id"

[policy_configurations.jwtauth_v1.keymanagers.jwks.remote]
uri = "http://testbench:3001/jwks"
