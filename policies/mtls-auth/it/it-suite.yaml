# The integration suite of the mtls-auth policy. Feature paths are relative to this directory. Give a
# runner a tags entry, "gateway-version>=X.Y.Z", only when the policy needs a gateway release newer
# than the oldest one tested.

suite: mtls-auth

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: mtls-auth
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
        overlay: overlays/mtls.toml
      - name: testbench
    runners:
      - name: mtls-auth
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_auth.feature
      - name: mtls-pool-references
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_pool_references.feature
      - name: mtls-listener
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_listener.feature
      - name: mtls-header-relay
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_header_relay.feature

  - name: mtls-auth-header-trust-any
    parallel: 1
    components:
      - name: platform-gateway
        db: sqlite
        overlay: overlays/mtls-header-trust-any.toml
      - name: testbench
    runners:
      - name: mtls-header-bypass
        tags: "gateway-version>1.2.0"
        features:
          - features/mtls_header_bypass.feature
