# Mutual TLS blocks. The key manager lets a scenario require a client certificate and a
# token on the same API.
[[policy_configurations.jwtauth_v1.keymanagers]]
name = "mock-jwks"
issuer = "http://testbench:3001/token"

[policy_configurations.jwtauth_v1.keymanagers.jwks.remote]
uri = "http://testbench:3001/jwks"

# The controller propagates a change to the runtime when it next polls the event hub.
[controller.event_hub]
poll_interval = "200ms"
