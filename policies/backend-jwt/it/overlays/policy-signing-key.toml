# Gateway configuration of the backend-jwt-policy-key block: both a gateway signing key ([signing])
# and a policy-level backend-jwt key are configured. A gateway newer than 1.2.0 signs backend JWTs
# with the gateway key, which carries a kid and is published at /.well-known/jwks. A 1.2.0 gateway
# has no gateway signing, ignores [signing], and signs with the policy-level key, with no kid. The
# two keys use different algorithms (ES256 and RS256) so a token shows which key signed it.

[[policy_configurations.jwtauth_v1.keymanagers]]
name = "mock-jwks"
issuer = "http://testbench:3001/token"

[policy_configurations.jwtauth_v1.keymanagers.jwks.remote]
uri = "http://testbench:3001/jwks"

# The block's signingKeys wiring mounts the framework's fixed integration-test keys at
# /secrets/gateway-runtime/signing, owned by the runtime user with mode 0400: active.pem is an
# EC P-256 key and previous.pem an RSA 2048 key. The gateway signs with active.pem; the
# policy-level key is previous.pem, whose public half is resources/keys/policy-signing-key.jwks.json.
[signing]
jwks_cache_max_age = "5m"

[[signing.keys]]
path = "/secrets/gateway-runtime/signing/active.pem"
active = true

[policy_configurations.backendjwt_v1]
algorithm = "SHA256withRSA"
issuer = "https://it-gateway.wso2.test"
tokenexpiry = "15m"
tokencaching = true
cachemaxsize = 1000

[policy_configurations.backendjwt_v1.signingkey]
path = "/secrets/gateway-runtime/signing/previous.pem"
