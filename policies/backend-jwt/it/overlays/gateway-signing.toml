# Gateway configuration of the backend-jwt-gateway-signing block: jwt-auth
# verifies callers against the testbench JWKS service, and backend-jwt signs
# with the gateway signing key below, published at /.well-known/jwks.

[[policy_configurations.jwtauth_v1.keymanagers]]
name = "mock-jwks"
issuer = "http://testbench:3001/token"

[policy_configurations.jwtauth_v1.keymanagers.jwks.remote]
uri = "http://testbench:3001/jwks"

# The block's signingKeys wiring mounts the framework's fixed integration-test
# keys at /secrets/gateway-runtime/signing, owned by the runtime user with mode
# 0400. active.pem is an EC P-256 key, so backend JWTs are signed ES256.
[signing]
jwks_cache_max_age = "5m"

[[signing.keys]]
path = "/secrets/gateway-runtime/signing/active.pem"
active = true

# No policy-level signingkey: the [signing] key above signs backend JWTs.
[policy_configurations.backendjwt_v1]
issuer = "https://it-gateway.wso2.test"
tokenexpiry = "15m"
tokencaching = true
cachemaxsize = 1000
