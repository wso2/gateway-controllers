# The integration suite of the backend-jwt v2 policy. Feature paths are relative to this directory.
# Give a runner a tags entry, "gateway-version>=X.Y.Z", only when the policy needs a gateway release
# newer than the oldest one tested.

suite: backend-jwt-v2

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
  timeouts:
    boot: 5m
    propagation: 60s

# Both a gateway signing key and a policy-level key are configured, so the scenarios verify the
# backend JWT against either public key (resources/keys/signing-keys.jwks.json). The caller tokens
# are signed by the scenarios themselves, trusted through the suite-caller-key key manager. The
# signing choice and the claim types do not depend on the database, so one engine runs.
blocks:
  - name: backend-jwt-v2-claim-types
    parallel: 1
    components:
      - name: platform-gateway
        db: sqlite
        overlay: overlays/policy-signing-key.toml
      - name: testbench
    wiring:
      platform-gateway:
        signingKeys: true
    runners:
      - name: backend-jwt-v2-claim-types
        features:
          - features/backend_jwt_claim_types.feature
