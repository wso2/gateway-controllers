name: xml-to-json
version: v0.1.0
description: |
  Transforms XML payloads to JSON in request and response mediation flows.
  Requires valid XML input; non-XML payloads fail policy execution.
  Do not attach this policy multiple times to the same resource flow.

parameters:
  type: object
  additionalProperties: false
  properties:
    onRequestFlow:
      type: boolean
      default: true
      description: |
        Converts incoming XML request payloads to JSON before forwarding upstream.
    onResponseFlow:
      type: boolean
      default: true
      description: |
        Converts outgoing XML response payloads to JSON before returning to clients.

systemParameters:
  type: object
  properties: {}
