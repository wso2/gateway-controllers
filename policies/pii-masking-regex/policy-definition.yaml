name: pii-masking-regex
version: v0.1.0
description: |
  Masks or redacts PII in request and response content using regex patterns.
  Supports reversible masking or permanent redaction.
  Request and response phases are configured independently.

parameters:
  type: object
  properties:
    piiEntities:
      type: array
      description: |
        Array of PII entity configurations, each containing:
        - piiEntity: Name/type of the PII entity (e.g., "EMAIL", "PHONE", "SSN")
        - piiRegex: Regular expression pattern to match the PII entity
      minItems: 1
      items:
        type: object
        properties:
          piiEntity:
            type: string
            description: Name/type of the PII entity
            minLength: 1
          piiRegex:
            type: string
            description: Regular expression pattern to match the PII entity
            minLength: 1
        required:
        - piiEntity
        - piiRegex
    jsonPath:
      type: string
      description: |
        JSONPath to extract a specific value from the JSON payload.
        If empty, processes the entire payload as a string.
        Examples: "$.message", "$.data.content", "$.items[0].text"
      default: ""
    redactPII:
      type: boolean
      description: |
        If true, redacts PII by replacing with "*****" (permanent, cannot be restored).
        If false (default), masks PII with placeholders that can be restored in responses.
      default: false
  required:
  - piiEntities

systemParameters:         
  type: object
  properties: {}
