# The integration suite of the azure-llm-cost policy. The scenarios attach no other policy. Feature
# and overlay paths are relative to this directory.
#
# The azure-llm-cost block sets the policy's pricing file, since gateways 1.1.0 and 1.2.0 have no
# default for it, and stages a test pricing file in place of the gateway's, so the expected costs
# follow from rates the suite controls (overlays/pricing/). The other blocks each give the policy
# an unusable pricing file.

suite: azure-llm-cost

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: azure-llm-cost
    parallel: 5
    components:
      - name: platform-gateway
        overlay: overlays/gateway.toml
        stagedFiles:
          # Written for this suite: test rates, not the gateway's shipped prices.
          llm-pricing/model_prices.json: overlays/pricing/model_prices.json
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: azure-llm-cost
        features:
          - features/azure_llm_cost.feature
      - name: azure-llm-cost-usage
        features:
          - features/azure_llm_cost_usage.feature
      - name: azure-llm-cost-streaming
        features:
          - features/azure_llm_cost_streaming.feature
      - name: azure-llm-cost-publishing
        tags: "~@known-issue"
        features:
          - features/azure_llm_cost_publishing.feature
      # Gateways 1.1.0 and 1.2.0 do not validate an LLM provider's policy parameters, so they accept
      # every configuration this feature expects to be rejected. Later gateways reject them.
      - name: azure-llm-cost-validation
        tags: "gateway-version>1.2.0"
        features:
          - features/azure_llm_cost_validation.feature

  # The blocks below each give the policy an unusable pricing file, which fails the policy when the
  # gateway builds a route's policy chain, before any request reaches a database. They run on
  # SQLite only: the database plays no part in loading the pricing file, so the other databases
  # would boot the same failure again.
  - name: azure-llm-cost-pricing-file-missing
    components:
      - name: platform-gateway
        overlay: overlays/pricing-file-missing.toml
      - name: testbench
    runners:
      - name: azure-llm-cost-pricing-file-missing
        features:
          - features/azure_llm_cost_pricing_file_missing.feature

  - name: azure-llm-cost-pricing-file-malformed
    components:
      - name: platform-gateway
        overlay: overlays/gateway.toml
        stagedFiles:
          # Written for this suite: cut off mid-entry, so it is not valid JSON.
          llm-pricing/model_prices.json: overlays/pricing/malformed.json
      - name: testbench
    runners:
      - name: azure-llm-cost-pricing-file-malformed
        features:
          - features/azure_llm_cost_pricing_file_malformed.feature

  - name: azure-llm-cost-pricing-file-no-azure-entries
    components:
      - name: platform-gateway
        overlay: overlays/gateway.toml
        stagedFiles:
          # Written for this suite: entries for other providers only.
          llm-pricing/model_prices.json: overlays/pricing/no-azure-entries.json
      - name: testbench
    runners:
      - name: azure-llm-cost-pricing-file-no-azure-entries
        features:
          - features/azure_llm_cost_pricing_file_no_azure_entries.feature

  - name: azure-llm-cost-pricing-file-empty
    components:
      - name: platform-gateway
        overlay: overlays/pricing-file-empty.toml
      - name: testbench
    runners:
      - name: azure-llm-cost-pricing-file-empty
        features:
          - features/azure_llm_cost_pricing_file_empty.feature

  - name: azure-llm-cost-pricing-file-not-string
    components:
      - name: platform-gateway
        overlay: overlays/pricing-file-not-string.toml
      - name: testbench
    runners:
      - name: azure-llm-cost-pricing-file-not-string
        features:
          - features/azure_llm_cost_pricing_file_not_string.feature

  # No overlay: the gateway's own configuration names no pricing file for the policy.
  - name: azure-llm-cost-pricing-file-omitted
    components:
      - name: platform-gateway
      - name: testbench
    runners:
      # Gateways after 1.2.0 give the policy a default pricing file, so the setting cannot be left
      # out there.
      - name: azure-llm-cost-pricing-file-omitted
        tags: "gateway-version<=1.2.0"
        features:
          - features/azure_llm_cost_pricing_file_omitted.feature

  - name: azure-llm-cost-pricing-file-traversal
    components:
      - name: platform-gateway
        overlay: overlays/pricing-file-traversal.toml
      - name: testbench
    runners:
      - name: azure-llm-cost-pricing-file-traversal
        features:
          - features/azure_llm_cost_pricing_file_traversal.feature

  - name: azure-llm-cost-pricing-file-sensitive
    components:
      - name: platform-gateway
        overlay: overlays/pricing-file-sensitive.toml
      - name: testbench
    runners:
      - name: azure-llm-cost-pricing-file-sensitive
        features:
          - features/azure_llm_cost_pricing_file_sensitive.feature
