# Gateways 1.1.0 and 1.2.0 have no default for the azure-llm-cost pricing file, so the path is set
# here for every version. It names the pricing file the block stages.
[policy_configurations.azure_llm_cost_v1]
pricing_file = "/etc/policy-engine/llm-pricing/model_prices.json"

# The policy logs each calculated cost at debug level; azure_llm_cost_publishing.feature checks
# that those lines carry no prompt or completion text.
[policy_engine.logging]
level = "debug"
