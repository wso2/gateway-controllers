name: azure-content-safety-content-moderation
version: v0.1.0
description: |
  Validates request and response content with Azure Content Safety content moderation.
  Supports configurable severity thresholds for hate, sexual, self-harm, and violence categories.
  Supports separate request and response phase configuration.

parameters:
  type: object
  properties:
    request:
      type: object
      description: Request-phase configuration.
      additionalProperties: false
      properties:
        jsonPath:
          type: string
          description: |
            JSONPath to extract a specific value from the JSON payload.
            If empty, validates the entire payload.
            Examples: "$.message", "$.data.content", "$.items[0].text"
          default: ""
        passthroughOnError:
          type: boolean
          description: |
            If true, allows requests to proceed if Azure Content Safety API call fails.
            If false (default), blocks requests on API errors.
          default: false
        showAssessment:
          type: boolean
          description: Controls assessment detail level in error responses.
          default: false
        hateCategory:
          type: integer
          description: |
            Severity threshold for hate category (0-7).
            -1 disables this category.
            Content with severity >= threshold will be blocked.
          minimum: -1
          maximum: 7
          default: -1
        sexualCategory:
          type: integer
          description: |
            Severity threshold for sexual category (0-7).
            -1 disables this category.
            Content with severity >= threshold will be blocked.
          minimum: -1
          maximum: 7
          default: -1
        selfHarmCategory:
          type: integer
          description: |
            Severity threshold for self-harm category (0-7).
            -1 disables this category.
            Content with severity >= threshold will be blocked.
          minimum: -1
          maximum: 7
          default: -1
        violenceCategory:
          type: integer
          description: |
            Severity threshold for violence category (0-7).
            -1 disables this category.
            Content with severity >= threshold will be blocked.
          minimum: -1
          maximum: 7
          default: -1
      anyOf:
        - required:
            - hateCategory
        - required:
            - sexualCategory
        - required:
            - selfHarmCategory
        - required:
            - violenceCategory
    response:
      type: object
      description: Response-phase configuration.
      additionalProperties: false
      properties:
        jsonPath:
          type: string
          description: |
            JSONPath to extract a specific value from the JSON payload.
            If empty, validates the entire payload.
            Examples: "$.message", "$.data.content", "$.items[0].text"
          default: ""
        passthroughOnError:
          type: boolean
          description: |
            If true, allows requests to proceed if Azure Content Safety API call fails.
            If false (default), blocks requests on API errors.
          default: false
        showAssessment:
          type: boolean
          description: Controls assessment detail level in error responses.
          default: false
        hateCategory:
          type: integer
          description: |
            Severity threshold for hate category (0-7).
            -1 disables this category.
            Content with severity >= threshold will be blocked.
          minimum: -1
          maximum: 7
          default: -1
        sexualCategory:
          type: integer
          description: |
            Severity threshold for sexual category (0-7).
            -1 disables this category.
            Content with severity >= threshold will be blocked.
          minimum: -1
          maximum: 7
          default: -1
        selfHarmCategory:
          type: integer
          description: |
            Severity threshold for self-harm category (0-7).
            -1 disables this category.
            Content with severity >= threshold will be blocked.
          minimum: -1
          maximum: 7
          default: -1
        violenceCategory:
          type: integer
          description: |
            Severity threshold for violence category (0-7).
            -1 disables this category.
            Content with severity >= threshold will be blocked.
          minimum: -1
          maximum: 7
          default: -1
      anyOf:
        - required:
            - hateCategory
        - required:
            - sexualCategory
        - required:
            - selfHarmCategory
        - required:
            - violenceCategory

systemParameters:
  type: object
  additionalProperties: false
  properties:
    azureContentSafetyEndpoint:
      type: string
      format: uri
      description: Azure Content Safety API endpoint URL (without trailing slash, e.g., https://your-resource.cognitiveservices.azure.com).
      minLength: 1
      "wso2/defaultValue": "${config.azurecontentsafety_endpoint}"
    azureContentSafetyKey:
      type: string
      description: Azure Content Safety API subscription key for authentication.
      minLength: 1
      "wso2/defaultValue": "${config.azurecontentsafety_key}"
  required:
    - azureContentSafetyEndpoint
    - azureContentSafetyKey
