# The testbench content-safety service and its subscription key, on a gateway that allows its APIs
# only workload identity, and only its own endpoint. An API without azureAuth uses api-key, which
# is not on the list.
azurecontentsafety_endpoint = "http://testbench:3005"
azurecontentsafety_key = "test-subscription-key"
azurecontentsafety_allowed_auth_types = ["workload-identity"]
azurecontentsafety_allowed_endpoints = ["http://testbench:3005"]
