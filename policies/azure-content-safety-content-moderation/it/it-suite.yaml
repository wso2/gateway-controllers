# The integration suite of the azure-content-safety-content-moderation policy. Feature paths are
# relative to this directory. Give a runner a tags entry, "gateway-version>=X.Y.Z", only when the
# policy needs a gateway release newer than the oldest one tested.

suite: azure-content-safety-content-moderation

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: azure-content-safety-content-moderation
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
        overlay: overlays/gateway.toml
      - name: testbench
    runners:
      - name: azure-content-safety
        features:
          - features/azure_content_safety.feature
      - name: azure-content-safety-content-moderation
        features:
          - features/azure_content_safety_content_moderation.feature
