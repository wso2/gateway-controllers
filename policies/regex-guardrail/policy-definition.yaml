name: regex-guardrail
version: v0.1.0
description: |
  Validates request and response content against regular expression patterns.
  Supports JSONPath extraction and optional inverted matching.
  Request and response phases are configured independently.

parameters:
  type: object
  properties:
    request:
      type: object
      description: Request-phase configuration.
      properties:
        regex:
          type: string
          description: Regular expression pattern to match against the content
          minLength: 1
        jsonPath:
          type: string
          description: |
            JSONPath to extract a specific value from the JSON payload.
            If empty, validates the entire payload.
            Examples: "$.message", "$.data.content", "$.items[0].text"
          default: ""
        invert:
          type: boolean
          description: |
            If true, validation passes when regex does NOT match (inverted logic).
            If false (default), validation passes when regex matches.
          default: false
        showAssessment:
          type: boolean
          description: Controls assessment detail level in error responses.
          default: false
      required:
      - regex
    response:
      type: object
      description: Response-phase configuration.
      properties:
        regex:
          type: string
          description: Regular expression pattern to match against the content
          minLength: 1
        jsonPath:
          type: string
          description: |
            JSONPath to extract a specific value from the JSON payload.
            If empty, validates the entire payload.
            Examples: "$.message", "$.data.content", "$.items[0].text"
          default: ""
        invert:
          type: boolean
          description: |
            If true, validation passes when regex does NOT match (inverted logic).
            If false (default), validation passes when regex matches.
          default: false
        showAssessment:
          type: boolean
          description: Controls assessment detail level in error responses.
          default: false
      required:
      - regex
  anyOf:
  - required:
    - request
  - required:
    - response

systemParameters:
  type: object
  properties: {}
