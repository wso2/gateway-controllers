name: url-guardrail
version: v0.1.0
description: |
  Validates URLs in request and response content.
  Supports DNS-only or HTTP HEAD reachability checks, with optional JSONPath extraction.
  Request and response phases are configured independently.

parameters:
  type: object
  properties:
    request:
      type: object
      description: Request-phase configuration.
      properties:
        jsonPath:
          type: string
          description: |
            JSONPath to extract a specific value from the JSON payload.
            If empty, validates the entire payload.
            Examples: "$.message", "$.data.content", "$.items[0].text"
          default: ""
        onlyDNS:
          type: boolean
          description: |
            If true, validates URLs only via DNS resolution (faster, less reliable).
            If false (default), validates URLs via HTTP HEAD request (slower, more reliable).
          default: false
        timeout:
          type: integer
          description: |
            Timeout in milliseconds for DNS lookup or HTTP HEAD request.
            Default is 3000ms (3 seconds).
          minimum: 0
          default: 3000
        showAssessment:
          type: boolean
          description: Controls assessment detail level for URL validation errors.
          default: false
    response:
      type: object
      description: Response-phase configuration.
      properties:
        jsonPath:
          type: string
          description: |
            JSONPath to extract a specific value from the JSON payload.
            If empty, validates the entire payload.
            Examples: "$.message", "$.data.content", "$.items[0].text"
          default: ""
        onlyDNS:
          type: boolean
          description: |
            If true, validates URLs only via DNS resolution (faster, less reliable).
            If false (default), validates URLs via HTTP HEAD request (slower, more reliable).
          default: false
        timeout:
          type: integer
          description: |
            Timeout in milliseconds for DNS lookup or HTTP HEAD request.
            Default is 3000ms (3 seconds).
          minimum: 0
          default: 3000
        showAssessment:
          type: boolean
          description: Controls assessment detail level for URL validation errors.
          default: false
  anyOf:
  - required:
    - request
  - required:
    - response

systemParameters:
  type: object
  properties: {}
