# The integration suite of the mcp-auth policy. Feature paths are relative to this directory. Give a
# runner a tags entry, "gateway-version>=X.Y.Z", only when the policy needs a gateway release newer
# than the oldest one tested.

suite: mcp-auth

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: mcp-auth
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
        overlay: overlays/gateway.toml
      - name: testbench
    runners:
      - name: mcp-auth-policy
        tags: "gateway-version>1.2.0"
        features:
          - features/mcp_auth.feature
      - name: mcp-gateway-url-precedence
        tags: "gateway-version>1.2.0"
        features:
          - features/mcp_gateway_url_precedence.feature
      - name: mcp-auth
        features:
          - features/mcp_auth_error_compatibility.feature
      # No gateway tag: the scenarios send handshake-style requests and build their upstream URL
      # with ${CTX:gatewayMCPUpstreamPath}, so they run on 1.1.0, 1.2.0 and latest.
      - name: mcp-auth-metadata
        features:
          - features/mcp_auth_metadata.feature
      - name: mcp-auth-authentication
        features:
          - features/mcp_auth_authentication.feature
      - name: mcp-auth-access
        features:
          - features/mcp_auth_access.feature
      - name: mcp-auth-validation
        features:
          - features/mcp_auth_validation.feature

  - name: mcp-auth-gateway-host
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
        overlay: overlays/mcp-auth-gateway-host.toml
      - name: testbench
    runners:
      - name: mcp-auth-gateway-host
        features:
          - features/mcp_auth_gateway_host.feature


  # MAN #32: a broken key manager configuration can only come from the gateway's own settings, so
  # each variant has its own block, overlay and feature file. No gateway tag: the scenarios are
  # version-neutral.
  - name: mcp-auth-km-blank-issuer
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
        overlay: overlays/mcp-auth-km-blank-issuer.toml
      - name: testbench
    runners:
      - name: mcp-auth-km-blank-issuer
        features:
          - features/mcp_auth_km_blank_issuer.feature

  - name: mcp-auth-km-blank-name
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
        overlay: overlays/mcp-auth-km-blank-name.toml
      - name: testbench
    runners:
      - name: mcp-auth-km-blank-name
        features:
          - features/mcp_auth_km_blank_name.feature

  - name: mcp-auth-km-not-array
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
        overlay: overlays/mcp-auth-km-not-array.toml
      - name: testbench
    runners:
      - name: mcp-auth-km-not-array
        features:
          - features/mcp_auth_km_not_array.feature

  - name: mcp-auth-custom-token
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
        overlay: overlays/mcp-auth-custom-token.toml
      - name: testbench
    runners:
      - name: mcp-auth-custom-token
        features:
          - features/mcp_auth_custom_token.feature
