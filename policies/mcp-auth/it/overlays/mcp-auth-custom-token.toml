# MAN #13, #10 and #9: a gateway where mcp-auth takes the token from another header, with another
# scheme, and answers a failed authentication with 403 instead of 401. A proxy cannot set these
# (on gateway 1.2.0 the controller rejects them in params), so they get their own block.
[policy_configurations.jwtauth_v1]
headername = "X-MCP-Token"
authheaderscheme = "Token"
# Written as 403.0 on purpose: the integer 403 reaches mcp-auth as an int64, which its integer
# reader does not accept, so the setting is silently ignored and the answer stays 401.
onfailurestatuscode = 403.0

[[policy_configurations.jwtauth_v1.keymanagers]]
name = "mock-jwks"
issuer = "http://testbench:3001/token"

[policy_configurations.jwtauth_v1.keymanagers.jwks.remote]
uri = "http://testbench:3001/jwks"

[policy_configurations.mcpauth_v1]
gatewayurl = "https://mcp-e2e-gatewayurl.example.com:7777"
