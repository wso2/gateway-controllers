# MAN #32: the gateway configured with keymanagers that is not a list. mcp-auth then refuses to build the
# protected-resource metadata for every proxy (500).
[policy_configurations.jwtauth_v1]
keymanagers = "mock-jwks"

[policy_configurations.mcpauth_v1]
gatewayurl = "https://mcp-e2e-gatewayurl.example.com:7777"
