name: log-message
version: v0.1.0
description: |
  Logs request and response payloads and headers.
  Request and response logging can be configured independently.

parameters:
  type: object
  additionalProperties: false
  properties:
    logRequestPayload:
      type: boolean
      default: false
      description: |
        Enables request payload logging.
    logRequestHeaders:
      type: boolean
      default: false
      description: |
        Enables request header logging.
    excludedRequestHeaders:
      type: string
      description: |
        Comma-separated header names to exclude from request header logging.
        Used only when `logRequestHeaders` is enabled.
    logResponsePayload:
      type: boolean
      default: false
      description: |
        Enables response payload logging.
    logResponseHeaders:
      type: boolean
      default: false
      description: |
        Enables response header logging.
    excludedResponseHeaders:
      type: string
      description: |
        Comma-separated header names to exclude from response header logging.
        Used only when `logResponseHeaders` is enabled.

  required: []

systemParameters:
  type: object
  properties: {}
