# The integration suite of the dynamic-endpoint policy. Feature paths are relative to this
# directory. Give a runner a tags entry, "gateway-version>=X.Y.Z", only when the policy needs a
# gateway release newer than the oldest one tested.
#
# Every runner requires gateway-version>=1.2.0 and is skipped on gateway 1.1.0. The policy itself
# did not change between the two releases (v1.0.1 is the same), but the gateway 1.1.0 does not
# apply the base path of the selected upstream definition: the policy engine looked the base path
# up under the wrong key, so it always missed and defaulted to "/", and a request to a named
# upstream reached it as "/whoami" instead of "/alternate/whoami". The gateway fixes below landed
# after the 1.1.0 release (api-platform repository, available from 1.2.0):
#   - 7cff05d2f  fix(policy-engine): resolve upstream base path for dynamic routing
#   - d4322992c  feat(controller)!: take upstreamDefinitions base path from basePath
#   - 30a24d2b7  fix(gateway): dynamic-endpoint double path prefix on sandbox vhost
#   - 6e79649c7  fix(gateway): preserve selected upstream across request phases
# Drop the tags when the oldest gateway under test includes these fixes.

suite: dynamic-endpoint

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: dynamic-endpoint
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: dynamic-endpoint
        tags: "gateway-version>=1.2.0"
        features:
          - features/dynamic_endpoint.feature
      - name: dynamic-endpoint-validation
        tags: "gateway-version>=1.2.0;~@known-issue"
        features:
          - features/dynamic_endpoint_validation.feature
      - name: dynamic-endpoint-composition
        tags: "gateway-version>=1.2.0"
        features:
          - features/dynamic_endpoint_composition.feature
      - name: dynamic-endpoint-resilience
        tags: "gateway-version>=1.2.0"
        features:
          - features/dynamic_endpoint_resilience.feature
      - name: dynamic-endpoint-concurrency
        tags: "gateway-version>=1.2.0"
        features:
          - features/dynamic_endpoint_concurrency.feature
      - name: dynamic-endpoint-security
        tags: "gateway-version>=1.2.0"
        features:
          - features/dynamic_endpoint_security.feature
      - name: dynamic-endpoint-lifecycle
        tags: "gateway-version>=1.2.0"
        features:
          - features/dynamic_endpoint_lifecycle.feature

  # The restart runner restarts the block's gateway, which would interrupt any runner sharing it.
  - name: dynamic-endpoint-restart
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: dynamic-endpoint-restart
        tags: "gateway-version>=1.2.0"
        features:
          - features/dynamic_endpoint_restart.feature

  # The runner resets and reads the block's shared analytics collector, so no other runner may
  # send traffic through the same gateway meanwhile. The overlay restores the gateway's default
  # of capturing no headers for analytics, which the scenario relies on to show that a
  # credential is not recorded.
  - name: dynamic-endpoint-observability
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
        overlay: overlays/default-header-capture.toml
      - name: testbench
    runners:
      - name: dynamic-endpoint-observability
        tags: "gateway-version>=1.2.0"
        features:
          - features/dynamic_endpoint_observability.feature

  # The API and its named upstreams reach each gateway through the control plane (platform-api),
  # so this block boots one with two gateways. Unlike the other blocks it needs a platform-api
  # that carries upstreamDefinitions through to the gateway.
  - name: dynamic-endpoint-multigateway
    parallel: 1
    components:
      - name: platform-api
        version: latest
        db: sqlite
      - name: platform-gateway
        dependsOn: [platform-api]
        replicas: 2
        db: sqlite
      - name: testbench
    runners:
      - name: dynamic-endpoint-multigateway
        tags: "gateway-version>=1.2.0;~@known-issue"
        features:
          - features/dynamic_endpoint_multigateway.feature
