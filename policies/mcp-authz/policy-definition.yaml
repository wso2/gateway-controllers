name: mcp-authz
version: v0.1.0
description: |
  Authorizes MCP tools, resources, prompts, and methods using JWT claims and OAuth scopes.
  Rules are evaluated by specificity, and all matching rules must pass.
  Apply `mcp-auth` before this policy to validate and extract token claims.

parameters:
  type: object
  additionalProperties: false
  properties:
    rules:
      type: array
      description: |
        Authorization rules for MCP attributes.
        Rules are evaluated by specificity, and all matching rules must pass.
      items:
        type: object
        additionalProperties: false
        required:
          - attribute
        properties:
          attribute:
            type: object
            description: |
              MCP attribute to authorize.
            additionalProperties: false
            required:
              - type
            properties:
              type:
                type: string
                enum:
                  - tool
                  - resource
                  - prompt
                  - method
                description: |
                  MCP attribute type: `tool`, `resource`, `prompt`, or `method`.

              name:
                type: string
                description: |
                  Attribute name. Use `*` to match all attributes of the selected type.
                minLength: 1
                maxLength: 256
                default: "*"

          requiredClaims:
            type: object
            description: |
              JWT claims that must match using exact string equality.
              If both `requiredClaims` and `requiredScopes` are set, both must pass.
            additionalProperties:
              type: string

          requiredScopes:
            type: array
            description: |
              OAuth scopes that must exist in the token (`scope` or `scp`).
              If both `requiredScopes` and `requiredClaims` are set, both must pass.
            items:
              type: string
              minLength: 1
              maxLength: 256
          anyOf:
            - required:
                - requiredClaims
            - required:
                - requiredScopes
      minItems: 1
