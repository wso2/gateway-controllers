name: mcp-authz
version: v1.4.0
description: |
  Authorize MCP tools, resources, prompts, and methods using claim/scope rules after `mcp-auth`; evaluate rules by specificity, require all matching rules to pass, and allow access when no rule matches.

parameters:
  type: object
  additionalProperties: true
  anyOf:
    - required:
        - tools
    - required:
        - resources
    - required:
        - prompts
    - required:
        - methods
  properties:
    tools:
      type: array
      x-wso2-policy-advanced-param: false
      description: Define authorization rules for MCP tools by setting the tool name plus required claims and/or scopes; exact-name rules are evaluated before wildcards, and all matching rules must pass.
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
          - name
        anyOf:
          - required:
              - requiredClaims
            properties:
              requiredClaims:
                minProperties: 1
          - required:
              - requiredScopes
            properties:
              requiredScopes:
                minItems: 1
          - required:
              - scopes
          - required:
              - claims
        properties:
          name:
            type: string
            x-wso2-policy-advanced-param: false
            description: Specify the tool name to authorize, or `*` to match all tools.
            default: "*"
            minLength: 1
            maxLength: 256

          requiredClaims:
            type: object
            x-wso2-policy-advanced-param: false
            x-wso2-policy-deprecated-param: true
            description: "DEPRECATED — use `claims` (allOf/anyOf) instead. Require JWT claims as `claimName: expectedValue`; all listed claims must exist and match exactly. Ignored when `claims` is set."
            default: {}
            additionalProperties:
              type: string

          requiredScopes:
            type: array
            x-wso2-policy-advanced-param: false
            x-wso2-policy-deprecated-param: true
            description: DEPRECATED — use `scopes` (allOf/anyOf) instead. Require OAuth scopes for this rule; at least one of the listed scopes must be present. Ignored when `scopes` is set.
            default: []
            items:
              type: string
              minLength: 1
              maxLength: 256

          scopes:
            type: object
            x-wso2-policy-advanced-param: false
            additionalProperties: false
            description: Scope requirement for this rule as `allOf` (all present) and/or `anyOf` (at least one present); AND-ed when both are set. Takes precedence over the deprecated `requiredScopes`.
            properties:
              allOf:
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 256
              anyOf:
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 256

          claims:
            type: object
            x-wso2-policy-advanced-param: false
            additionalProperties: false
            description: Claim requirement for this rule as `allOf` and/or `anyOf` matchers, each `{ claim, values }`; a matcher is satisfied when the claim's value is one of `values`. AND-ed when both are set. Takes precedence over the deprecated `requiredClaims`.
            properties:
              allOf:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - claim
                    - values
                  properties:
                    claim:
                      type: string
                      minLength: 1
                    values:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
              anyOf:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - claim
                    - values
                  properties:
                    claim:
                      type: string
                      minLength: 1
                    values:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1

    resources:
      type: array
      x-wso2-policy-advanced-param: false
      description: Define authorization rules for MCP resources by setting the resource URI plus required claims and/or scopes; exact-name rules are evaluated before wildcards, and all matching rules must pass.
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
          - name
        anyOf:
          - required:
              - requiredClaims
            properties:
              requiredClaims:
                minProperties: 1
          - required:
              - requiredScopes
            properties:
              requiredScopes:
                minItems: 1
          - required:
              - scopes
          - required:
              - claims
        properties:
          name:
            type: string
            x-wso2-policy-advanced-param: false
            description: Specify the resource URI to authorize, or `*` to match all resources.
            default: "*"
            minLength: 1
            maxLength: 256

          requiredClaims:
            type: object
            x-wso2-policy-advanced-param: false
            x-wso2-policy-deprecated-param: true
            description: "DEPRECATED — use `claims` (allOf/anyOf) instead. Require JWT claims as `claimName: expectedValue`; all listed claims must exist and match exactly. Ignored when `claims` is set."
            default: {}
            additionalProperties:
              type: string

          requiredScopes:
            type: array
            x-wso2-policy-advanced-param: false
            x-wso2-policy-deprecated-param: true
            description: DEPRECATED — use `scopes` (allOf/anyOf) instead. Require OAuth scopes for this rule; at least one of the listed scopes must be present. Ignored when `scopes` is set.
            default: []
            items:
              type: string
              minLength: 1
              maxLength: 256

          scopes:
            type: object
            x-wso2-policy-advanced-param: false
            additionalProperties: false
            description: Scope requirement for this rule as `allOf` (all present) and/or `anyOf` (at least one present); AND-ed when both are set. Takes precedence over the deprecated `requiredScopes`.
            properties:
              allOf:
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 256
              anyOf:
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 256

          claims:
            type: object
            x-wso2-policy-advanced-param: false
            additionalProperties: false
            description: Claim requirement for this rule as `allOf` and/or `anyOf` matchers, each `{ claim, values }`; a matcher is satisfied when the claim's value is one of `values`. AND-ed when both are set. Takes precedence over the deprecated `requiredClaims`.
            properties:
              allOf:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - claim
                    - values
                  properties:
                    claim:
                      type: string
                      minLength: 1
                    values:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
              anyOf:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - claim
                    - values
                  properties:
                    claim:
                      type: string
                      minLength: 1
                    values:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1

    prompts:
      type: array
      x-wso2-policy-advanced-param: false
      description: Define authorization rules for MCP prompts by setting the prompt name plus required claims and/or scopes; exact-name rules are evaluated before wildcards, and all matching rules must pass.
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
          - name
        anyOf:
          - required:
              - requiredClaims
            properties:
              requiredClaims:
                minProperties: 1
          - required:
              - requiredScopes
            properties:
              requiredScopes:
                minItems: 1
          - required:
              - scopes
          - required:
              - claims
        properties:
          name:
            type: string
            x-wso2-policy-advanced-param: false
            description: Specify the prompt name to authorize, or `*` to match all prompts.
            default: "*"
            minLength: 1
            maxLength: 256

          requiredClaims:
            type: object
            x-wso2-policy-advanced-param: false
            x-wso2-policy-deprecated-param: true
            description: "DEPRECATED — use `claims` (allOf/anyOf) instead. Require JWT claims as `claimName: expectedValue`; all listed claims must exist and match exactly. Ignored when `claims` is set."
            default: {}
            additionalProperties:
              type: string

          requiredScopes:
            type: array
            x-wso2-policy-advanced-param: false
            x-wso2-policy-deprecated-param: true
            description: DEPRECATED — use `scopes` (allOf/anyOf) instead. Require OAuth scopes for this rule; at least one of the listed scopes must be present. Ignored when `scopes` is set.
            default: []
            items:
              type: string
              minLength: 1
              maxLength: 256

          scopes:
            type: object
            x-wso2-policy-advanced-param: false
            additionalProperties: false
            description: Scope requirement for this rule as `allOf` (all present) and/or `anyOf` (at least one present); AND-ed when both are set. Takes precedence over the deprecated `requiredScopes`.
            properties:
              allOf:
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 256
              anyOf:
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 256

          claims:
            type: object
            x-wso2-policy-advanced-param: false
            additionalProperties: false
            description: Claim requirement for this rule as `allOf` and/or `anyOf` matchers, each `{ claim, values }`; a matcher is satisfied when the claim's value is one of `values`. AND-ed when both are set. Takes precedence over the deprecated `requiredClaims`.
            properties:
              allOf:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - claim
                    - values
                  properties:
                    claim:
                      type: string
                      minLength: 1
                    values:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
              anyOf:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - claim
                    - values
                  properties:
                    claim:
                      type: string
                      minLength: 1
                    values:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1

    methods:
      type: array
      x-wso2-policy-advanced-param: false
      description: Define authorization rules for MCP methods by setting the method name plus required claims and/or scopes; exact-name rules are evaluated before wildcards, and all matching rules must pass.
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
          - name
        anyOf:
          - required:
              - requiredClaims
            properties:
              requiredClaims:
                minProperties: 1
          - required:
              - requiredScopes
            properties:
              requiredScopes:
                minItems: 1
          - required:
              - scopes
          - required:
              - claims
        properties:
          name:
            type: string
            x-wso2-policy-advanced-param: false
            description: Specify the method name to authorize (e.g., `tools/call`), or `*` to match every
              method this policy can govern. Only `tools/…`, `resources/…` and `prompts/…` methods are
              governable here; bare methods such as `initialize` and `ping`, and other namespaces such as
              `server/discover` or `notifications/…`, are skipped before rules are matched. Use the MCP
              Authentication policy's `methods` configuration for those.
            default: "*"
            minLength: 1
            maxLength: 256

          requiredClaims:
            type: object
            x-wso2-policy-advanced-param: false
            x-wso2-policy-deprecated-param: true
            description: "DEPRECATED — use `claims` (allOf/anyOf) instead. Require JWT claims as `claimName: expectedValue`; all listed claims must exist and match exactly. Ignored when `claims` is set."
            default: {}
            additionalProperties:
              type: string

          requiredScopes:
            type: array
            x-wso2-policy-advanced-param: false
            x-wso2-policy-deprecated-param: true
            description: DEPRECATED — use `scopes` (allOf/anyOf) instead. Require OAuth scopes for this rule; at least one of the listed scopes must be present. Ignored when `scopes` is set.
            default: []
            items:
              type: string
              minLength: 1
              maxLength: 256

          scopes:
            type: object
            x-wso2-policy-advanced-param: false
            additionalProperties: false
            description: Scope requirement for this rule as `allOf` (all present) and/or `anyOf` (at least one present); AND-ed when both are set. Takes precedence over the deprecated `requiredScopes`.
            properties:
              allOf:
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 256
              anyOf:
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 256

          claims:
            type: object
            x-wso2-policy-advanced-param: false
            additionalProperties: false
            description: Claim requirement for this rule as `allOf` and/or `anyOf` matchers, each `{ claim, values }`; a matcher is satisfied when the claim's value is one of `values`. AND-ed when both are set. Takes precedence over the deprecated `requiredClaims`.
            properties:
              allOf:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - claim
                    - values
                  properties:
                    claim:
                      type: string
                      minLength: 1
                    values:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
              anyOf:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - claim
                    - values
                  properties:
                    claim:
                      type: string
                      minLength: 1
                    values:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
