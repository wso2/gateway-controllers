# The gateway configuration overlay of the oauth2-token-exchange suite (it-suite.yaml names it).

# tokenEndpoint must be https:// unless this system parameter opts in to plain http. The
# testbench "oauth2" service, the authorization server these scenarios exchange tokens with, is
# plain HTTP like every other testbench service.
[policy_configurations.oauth2tokenexchange_v0]
allowinsecuretokenendpoint = true

# The jwt-auth and mcp-auth chain scenarios need "mock-jwks" to resolve as a key manager: their
# issuers parameter names a key manager, not a literal issuer URL.
[[policy_configurations.jwtauth_v1.keymanagers]]
name = "mock-jwks"
issuer = "http://testbench:3001/token"

[policy_configurations.jwtauth_v1.keymanagers.jwks.remote]
uri = "http://testbench:3001/jwks"
