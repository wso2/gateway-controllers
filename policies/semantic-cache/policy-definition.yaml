name: semantic-cache
version: v1.4.0
description: |
  Caches LLM responses using semantic similarity over request embeddings to
  reduce repeated upstream calls. Returns cached responses on similarity hits
  and stores successful upstream responses for future reuse.

  Cache entries are bound to the authenticated caller (application/subscriber
  identity), so one caller can never receive another caller's cached response.
  Responses marked Cache-Control: no-store, private, or no-cache are never
  cached. Requests with no resolvable caller identity are not cached unless
  cacheUnauthenticated is explicitly enabled.

parameters:
  type: object
  propertyNames:
    not:
      enum: [embeddingAllowedAuthTypes, embeddingAllowedEndpoints]
  properties:
    similarityThreshold:
      type: number
      description: |
        Specifies the minimum similarity score (0.0 to 1.0) required to treat a
        request as a cache hit.
      default: 0.5
      minimum: 0.0
      maximum: 1.0
    azureAuth:
      type: object
      x-wso2-policy-advanced-param: true
      additionalProperties: false
      description: |
        How this API's embedding calls authenticate to Azure OpenAI. Omit it to
        send the API key. The identity types need the AZURE_OPENAI embedding
        provider. The gateway's embedding_provider_allowed_auth_types can limit
        the types an API may use.
      properties:
        authenticationType:
          type: string
          x-wso2-policy-advanced-param: false
          description: |
            "api-key", the default, sends the API key: the API's apiKey, or the
            gateway's embedding_provider_api_key. The other types send a
            Microsoft Entra ID access token for the gateway's Azure identity
            instead, and need the AZURE_OPENAI embedding provider.
            "workload-identity" uses AKS Workload Identity: the gateway pod runs
            with a service account federated with a Microsoft Entra ID identity.
            "managed-identity" uses a managed identity of the host the gateway
            runs on, from the Azure Instance Metadata Service of a VM, VM scale
            set or AKS node. "container-apps" uses a managed identity of the
            Azure Container Apps app the gateway runs in. The identity needs the
            Cognitive Services OpenAI User role on the Azure OpenAI resource.
          enum:
            - api-key
            - workload-identity
            - managed-identity
            - container-apps
          default: api-key
        clientId:
          type: string
          x-wso2-policy-advanced-param: false
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          description: |
            Application (client) ID of the identity, for the Azure identity
            types. With workload-identity, defaults to AZURE_CLIENT_ID. With
            managed-identity or container-apps, selects a user-assigned identity;
            leave it unset for the host's or app's system-assigned identity.
            Ignored with api-key.
        scope:
          type: string
          x-wso2-policy-advanced-param: false
          pattern: "^\\S+/\\.default$"
          description: |
            Scope of the access token, for the Azure identity types. Defaults to
            "https://cognitiveservices.azure.com/.default". Ignored with api-key.
    jsonPath:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        Specifies the JSONPath used to extract text for embedding generation.
        When omitted, the entire request body is used.
      default: "$.messages[-1].content"
    streamingJsonPath:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        Specifies the JSONPath used to extract content from each SSE streaming
        delta event when caching streamed responses. Only needed if the upstream
        uses a non-OpenAI-compatible streaming format.
      default: "$.choices[0].delta.content"
    cacheUnauthenticated:
      type: boolean
      x-wso2-policy-advanced-param: true
      description: |
        Controls caching behavior for requests with no resolvable caller
        identity (e.g. a fully public, unauthenticated API). Defaults to false:
        such requests are neither served from nor stored into the cache.

        SECURITY WARNING: setting this to true makes all identity-less callers
        of this API share a single cache bucket. Any caller who can influence
        the upstream's response for a given prompt can seed an entry that is
        later served to a DIFFERENT identity-less caller as a trusted cache
        hit (cache poisoning), and a personalized or sensitive response
        produced for one identity-less caller can be replayed to another.
        Only enable this for APIs where every possible response is safe to
        share across all unauthenticated callers.
      default: false
    jevCacheCheck:
      type: object
      x-wso2-policy-advanced-param: true
      additionalProperties: false
      description: |
        Optional TypeSafe Jev admission check for cache writes. When enabled,
        the extracted request text and generated response text are sent to Jev
        just before storage. A response is stored only when no configured
        question reaches its threshold. Jev errors, timeouts, malformed
        answers, and unreadable response text skip the cache write without
        changing the response returned to the client.
      properties:
        enabled:
          type: boolean
          default: false
        timeout:
          type: string
          description: Maximum duration of the Jev call, including one retry on HTTP 429 or 529.
          default: "5s"
          pattern: '^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$'
        questions:
          type: array
          description: |
            Questions used to reject cache writes, pre-filled with the default
            time-sensitive, context-dependent, unhelpful, and sensitive-data
            questions. The policy evaluates exactly the questions in a
            non-empty array, so adding two questions to the four pre-filled
            defaults evaluates all six, while removing a pre-filled question
            disables that check. Any configured question that reaches its
            threshold skips the cache write. An omitted or empty array restores
            and evaluates all four defaults.
          items:
            type: object
            additionalProperties: false
            properties:
              key:
                type: string
                minLength: 1
              type:
                type: string
                enum: [noul, score]
              instructions:
                type: string
                minLength: 1
              criteria:
                description: |
                  For score, an ordered array of 2 to 10 scale descriptions
                  (low to high). Not used for noul questions.
                type: array
                items:
                  type: string
                  minLength: 1
              threshold:
                type: number
            required: [key, type, instructions, threshold]
          default:
          - key: time_sensitive
            type: noul
            instructions: "Does the answer in `response` depend on the current date or time, or on live information such as news, prices, weather, or stock levels?"
            threshold: 0.7
          - key: needs_context
            type: noul
            instructions: "Does `request` only make sense together with earlier messages in the conversation, for example a follow-up like 'tell me more' or 'what about the second one'?"
            threshold: 0.7
          - key: unhelpful_response
            type: noul
            instructions: "Is `response` a refusal, an error, or a reply saying the request couldn't be completed?"
            threshold: 0.7
          - key: sensitive_data
            type: noul
            instructions: "Do `request` or `response` contain secrets, credentials, or personal data such as passwords, card numbers, or ID numbers?"
            threshold: 0.7
      required: [enabled]
  required:
  - similarityThreshold

systemParameters:
  type: object
  properties:
    embeddingProvider:
      type: string
      description: |
        Embedding provider type: "OPENAI", "MISTRAL", "AZURE_OPENAI"
      enum:
      - OPENAI
      - MISTRAL
      - AZURE_OPENAI
      "wso2/defaultValue": "${config.embedding_provider}"
    embeddingEndpoint:
      type: string
      description: |
        Endpoint URL for the embedding service (required for OPENAI, MISTRAL, AZURE_OPENAI)
        For OpenAI: "https://api.openai.com/v1/embeddings"
        For Mistral: "https://api.mistral.ai/v1/embeddings"
        For Azure OpenAI: Azure OpenAI endpoint URL
      minLength: 1
      "wso2/defaultValue": "${config.embedding_provider_endpoint}"
    embeddingModel:
      type: string
      description: |
        Embedding model name (required for OPENAI, MISTRAL; not required for AZURE_OPENAI)
        For OpenAI: "text-embedding-ada-002" or "text-embedding-3-small"
        For Mistral: "mistral-embed"
        For Azure OpenAI: Not required (deployment name is in the endpoint URL)
      "wso2/defaultValue": "${config.embedding_provider_model}"
    embeddingDimension:
      type: integer
      description: |
        Dimension of embedding vectors (required for some vector databases)
        Common values: 1536 (OpenAI ada-002), 1024 (Mistral), etc.
      "wso2/defaultValue": "${config.embedding_provider_dimension}"
    apiKey:
      type: string
      description: |
        API key for the embedding service. Required in api-key mode, for every
        provider: every API whose azureAuth.authenticationType is api-key, the
        default, sends it unless the API has its own. Not needed when every API
        uses an Azure identity.
        For Azure OpenAI, this may be the API key or the header name for authentication
      minLength: 1
      "wso2/defaultValue": "${config.embedding_provider_api_key}"
    embeddingAllowedAuthTypes:
      type: array
      items:
        type: string
        enum:
          - api-key
          - workload-identity
          - managed-identity
          - container-apps
      description: |
        If non-empty, the authentication types this gateway's APIs may choose
        in azureAuth.authenticationType. An API without azureAuth uses api-key
        and is checked as such. Leave out api-key to stop APIs sending the key;
        list only api-key to keep them off the gateway's Azure identities. Empty
        (the default) places no limit.
      "wso2/defaultValue": "${config.embedding_provider_allowed_auth_types}"
    embeddingAllowedEndpoints:
      type: array
      items:
        type: string
      description: |
        If non-empty, the embedding resources this gateway's APIs may call,
        including the gateway's own embedding_provider_endpoint. Entries are
        resource URLs, such as https://<resource>.openai.azure.com, with no
        path, query or fragment. They are matched on scheme, host and port,
        ignoring case, against the endpoint an API uses, its own or the
        gateway's, so the gateway's key and tokens for its Azure identity are
        only sent to listed resources. Any deployment on a listed resource is
        allowed. Empty (the default) places no limit.
      "wso2/defaultValue": "${config.embedding_provider_allowed_endpoints}"
    vectorStoreProvider:
      type: string
      description: |
        Vector database provider: "REDIS" or "MILVUS"
      enum:
      - REDIS
      - MILVUS
      "wso2/defaultValue": "${config.vector_db_provider}"
    dbHost:
      type: string
      description: Vector database host (required for Redis/Milvus)
      minLength: 1
      "wso2/defaultValue": "${config.vector_db_provider_host}"
    dbPort:
      type: integer
      description: Vector database port (required for Redis/Milvus)
      "wso2/defaultValue": "${config.vector_db_provider_port}"
    username:
      type: string
      description: Vector database username (optional)
      "wso2/defaultValue": "${config.vector_db_provider_username}"
    password:
      type: string
      description: Vector database password (optional)
      "wso2/defaultValue": "${config.vector_db_provider_password}"
    database:
      type: string
      description: Vector database (optional)
      "wso2/defaultValue": "${config.vector_db_provider_database}"
    ttl:
      type: integer
      description: Vector database TTL (optional)
      "wso2/defaultValue": "${config.vector_db_provider_ttl}"
    jevApiKey:
      type: string
      description: TypeSafe AI API key. Required only when jevCacheCheck.enabled is true.
      "wso2/defaultValue": "${config.policy_configurations.typesafe_jev_v0.api_key}"
    jevBaseURL:
      type: string
      format: uri
      description: TypeSafe Jev API base URL.
      "wso2/defaultValue": "${config.policy_configurations.typesafe_jev_v0.base_url}"
    jevModel:
      type: string
      description: TypeSafe Jev model identifier.
      "wso2/defaultValue": "${config.policy_configurations.typesafe_jev_v0.model}"
  required:
  - embeddingProvider
  - embeddingEndpoint
  - vectorStoreProvider
  - embeddingDimension
  - dbHost
  - dbPort
