# The integration suite of the semantic-cache policy. Feature paths are relative to this directory.
# Give a runner a tags entry, "gateway-version>=X.Y.Z", only when the policy needs a gateway release
# newer than the oldest one tested.

suite: semantic-cache

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: semantic-cache
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
        overlay: overlays/gateway.toml
        dependsOn: [redis]
      - name: testbench
      - name: redis
    runners:
      - name: semantic-cache-policy
        tags: "gateway-version>=1.2.0"
        features:
          - features/semantic_cache.feature
      - name: semantic-cache-isolation
        tags: "gateway-version>=1.2.0"
        features:
          - features/semantic_cache_isolation.feature
      - name: semantic-cache
        features:
          - features/semantic_cache_error_compatibility.feature

  # The gateway's embedding provider is the testbench Azure OpenAI deployment with no API key, and
  # each API chooses its Azure identity in azureAuth, so one gateway serves every identity. A cache
  # hit needs an embedding, so a hit shows the identity authenticated the embedding call. The
  # gateway gets its identities from the testbench Entra ID and Container Apps mocks. The database
  # plays no part in authentication, so this block runs on sqlite only.
  - name: semantic-cache-identity
    parallel: 1
    components:
      - name: platform-gateway
        overlay: overlays/identity.toml
        dependsOn: [redis]
      - name: testbench
      - name: redis
    runners:
      - name: semantic-cache-identity
        features:
          - features/semantic_cache_identity.feature
