name: openai-to-gemini-transformer
version: v0.10.1
description: |
  Translates OpenAI Chat Completions requests to the Gemini generateContent API
  format and rewrites Gemini responses back to the OpenAI shape.

  Non-streaming generateContent responses become OpenAI ChatCompletion JSON.
  Streaming responses (streamGenerateContent?alt=sse) are converted from Gemini's
  Server-Sent Events into OpenAI Chat Completions SSE (data: {chunk}\n\n ...
  data: [DONE]), covering candidate text, function calls as tool_calls, per-
  candidate choice indices, finish reasons, and final usage. Events are parsed
  incrementally, so it handles the stream in both buffered and chunk-by-chunk
  (true streaming) modes. Supports routed and unconditional execution modes.

parameters:
  type: object
  additionalProperties: false
  properties:
    model:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        Fallback Gemini model name (for example gemini-2.5-pro), used only
        when the request payload names no model. It does not override a model
        the client named. Whichever model is resolved is used in the rewritten
        path.
      minLength: 1
    providerId:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        Provider this translator targets. Used as the upstream cluster name
        (matching an id or as alias in the LlmProxy additionalProviders list) and, in
        multi-provider mode, as the key matched (case-insensitive) against
        SharedContext.Metadata["selected_provider"]. When no provider has been
        selected upstream (single-provider proxy), the translator always runs;
        when a provider has been selected, it runs only if the selection
        matches this provider id. When omitted, routing is left to the route's
        default upstream.
      minLength: 1
    apiVersion:
      type: string
      x-wso2-policy-advanced-param: true
      description: |
        Gemini API version segment used in the rewritten path
        (/{apiVersion}/models/{model}:generateContent).
      default: "v1beta"
      minLength: 1

systemParameters:
  type: object
  properties: {}
