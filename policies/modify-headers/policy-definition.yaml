name: modify-headers
version: v0.1.2
description: |
  Modifies request and response headers.
  Supports `SET` (replace) and `DELETE` (remove) operations.

parameters:
  type: object
  properties:
    requestHeaders:
      type: array
      description: Array of header modifications to apply during request phase. At least
        one of requestHeaders or responseHeaders must be specified.
      items:
        type: object
        properties:
          action:
            type: string
            description: Action to perform on the header
            enum:
            - SET
            - DELETE
          name:
            type: string
            description: Header name (case-insensitive)
            minLength: 1
            maxLength: 256
            pattern: "^[a-zA-Z0-9-_]+$"
          value:
            type: string
            description: Header value (required for SET, ignored for DELETE)
            maxLength: 8192
        required:
        - action
        - name
        resolve:
        - value
        allOf:
        - if:
            properties:
              action:
                const: SET
          then:
            required:
            - value
    responseHeaders:
      type: array
      description: Array of header modifications to apply during response phase. At
        least one of requestHeaders or responseHeaders must be specified.
      items:
        type: object
        properties:
          action:
            type: string
            description: Action to perform on the header
            enum:
            - SET
            - DELETE
          name:
            type: string
            description: Header name (case-insensitive)
            minLength: 1
            maxLength: 256
            pattern: "^[a-zA-Z0-9-_]+$"
          value:
            type: string
            description: Header value (required for SET, ignored for DELETE)
            maxLength: 8192
        required:
        - action
        - name
        resolve:
        - value
        allOf:
        - if:
            properties:
              action:
                const: SET
          then:
            required:
            - value
  anyOf:
    - required: [requestHeaders]
    - required: [responseHeaders]

systemParameters:
  type: object
  properties: {}
