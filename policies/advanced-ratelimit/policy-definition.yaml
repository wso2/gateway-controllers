name: advanced-ratelimit
version: v0.1.4
description: |
  Advanced rate limiting with multiple quotas, flexible key extraction, and optional cost extraction.
  Supports GCRA and fixed-window algorithms with in-memory or Redis backends.
  Adds standard rate-limit headers, including X-RateLimit-*, IETF RateLimit, and Retry-After.

parameters:
  type: object
  additionalProperties: false
  required: ["quotas"]
  properties:
    quotas:
      type: array
      description: |
        Quota definitions for multi-dimensional rate limiting.
        Each quota has its own limits, key extraction, and optional cost extraction.
      minItems: 1
      maxItems: 10
      items:
        type: object
        additionalProperties: false
        required: ["limits"]
        properties:
          name:
            type: string
            description: |
              Optional quota name used for logging and `X-RateLimit-Quota` responses.
            minLength: 1
            maxLength: 128

          limits:
            type: array
            description: |
              Rate limits for this quota.
              Multiple windows are supported; the most restrictive active limit is enforced.
            minItems: 1
            maxItems: 10
            items:
              type: object
              additionalProperties: false
              required: ["limit", "duration"]
              properties:
                limit:
                  type: integer
                  description: Maximum number of tokens/requests allowed in the duration
                  minimum: 1
                  maximum: 1000000000
                duration:
                  type: string
                  description: |
                    Time window in Go duration format (for example `1s`, `1m`, `1h`, `24h`).
                  pattern: "^(([0-9]+(\\.[0-9]*)?|\\.[0-9]+)(ns|us|µs|ms|s|m|h))+$"
                burst:
                  type: integer
                  description: |
                    Burst capacity for this limit.
                    If omitted, defaults to the `limit` value.
                  minimum: 1
                  maximum: 1000000000

          keyExtraction:
            type: array
            description: |
              Per-quota key extraction.
              If omitted, inherits global `keyExtraction` or defaults to route name.
            minItems: 0
            maxItems: 5
            items:
              type: object
              additionalProperties: false
              required: ["type"]
              properties:
                type:
                  type: string
                  description: |
                    Key component source.
                    `header`, `metadata`, and `constant` use `key`; `cel` uses `expression`.
                  enum: ["header", "metadata", "ip", "apiname", "apiversion", "routename", "cel", "constant"]
                key:
                  type: string
                  description: Header name or metadata key (required for header/metadata types)
                  minLength: 1
                  maxLength: 256
                expression:
                  type: string
                  description: |
                    CEL expression used when `type=cel`.
                    Must evaluate to a string key.
                  minLength: 1
                  maxLength: 1024

          costExtraction:
            type: object
            description: |
              Dynamic cost extraction for token/usage-based rate limiting.
              When multiple sources succeed, their values are summed after applying multipliers.
            additionalProperties: false
            properties:
              enabled:
                type: boolean
                description: Enable dynamic cost extraction
                default: false

              sources:
                type: array
                description: |
                  Sources used to extract dynamic cost.
                  Successful values are summed; if all fail, `default` is used.
                minItems: 1
                maxItems: 10
                items:
                  type: object
                  additionalProperties: false
                  required: ["type"]
                  properties:
                    type:
                      type: string
                      description: |
                        Cost source type.
                        Header/metadata types use `key`, body types use `jsonPath`, CEL types use `expression`.
                      enum: ["request_header", "request_metadata", "request_body",
                             "response_header", "response_metadata", "response_body",
                             "request_cel", "response_cel"]

                    key:
                      type: string
                      description: |
                        Header name (`*_header`) or metadata key (`*_metadata`).
                      minLength: 1
                      maxLength: 256

                    jsonPath:
                      type: string
                      description: |
                        JSONPath for body-based extraction (`*_body` types).
                      minLength: 1
                      maxLength: 512

                    expression:
                      type: string
                      description: |
                        CEL expression for `request_cel` and `response_cel` sources.
                        Must evaluate to a numeric value.
                      minLength: 1
                      maxLength: 1024

                    multiplier:
                      type: number
                      description: |
                        Multiplier applied to extracted values.
                      minimum: 0
                      default: 1.0

              default:
                type: number
                description: Default cost to use if extraction fails from all sources
                minimum: 0
                maximum: 1000000000
                default: 1
            allOf:
              - if:
                  properties:
                    enabled:
                      const: true
                then:
                  required:
                    - sources

    keyExtraction:
      type: array
      description: |
        Global key extraction default for quotas without their own `keyExtraction`.
        If omitted or empty, route name is used.
      minItems: 0
      maxItems: 5
      items:
        type: object
        additionalProperties: false
        required: ["type"]
        properties:
          type:
            type: string
            description: |
              Key component source.
              `header`, `metadata`, and `constant` use `key`; `cel` uses `expression`.
            enum: ["header", "metadata", "ip", "apiname", "apiversion", "routename", "cel", "constant"]
          key:
            type: string
            description: Header name or metadata key (required for header/metadata types)
            minLength: 1
            maxLength: 256
          expression:
            type: string
            description: |
              CEL expression used when `type=cel`.
              Must evaluate to a string key.
            minLength: 1
            maxLength: 1024

    onRateLimitExceeded:
      type: object
      description: Customize the 429 response when rate limit is exceeded
      additionalProperties: false
      properties:
        statusCode:
          type: integer
          description: HTTP status code for rate limit response
          minimum: 400
          maximum: 599
          default: 429

        body:
          type: string
          description: Custom error message body
          maxLength: 8192
          default: '{"error": "Too Many Requests", "message": "Rate limit exceeded. Please try again later."}'

        bodyFormat:
          type: string
          description: Response body content type
          enum: ["json", "plain"]
          default: "json"

systemParameters:
  type: object
  additionalProperties: false
  properties:
    algorithm:
      type: string
      description: |
        Rate limiting algorithm to use:
        - gcra: Generic Cell Rate Algorithm (default). Provides smooth rate limiting
          with burst support and token bucket semantics. Better for consistent traffic
          shaping and burst handling.
        - fixed-window: Simple fixed time window counter. Divides time into fixed
          intervals and counts requests per window. Lower computational overhead,
          but can allow up to 2x burst at window boundaries.
      enum: ["gcra", "fixed-window"]
      default: "gcra"
      "wso2/defaultValue": "${config.policy_configurations.ratelimit_v0.algorithm}"

    backend:
      type: string
      description: |
        Rate limit storage backend. 'memory' for in-memory storage (single-instance),
        'redis' for distributed rate limiting across multiple gateway instances.
      enum: ["memory", "redis"]
      default: "memory"
      "wso2/defaultValue": "${config.policy_configurations.ratelimit_v0.backend}"

    redis:
      type: object
      description: Redis configuration (only used when backend=redis)
      additionalProperties: false
      properties:
        host:
          type: string
          description: Redis server hostname or IP address
          default: "localhost"
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v0.redis.host}"

        port:
          type: integer
          description: Redis server port
          minimum: 1
          maximum: 65535
          default: 6379
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v0.redis.port}"

        password:
          type: string
          description: Redis authentication password (optional)
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v0.redis.password}"

        username:
          type: string
          description: Redis ACL username (optional, Redis 6+)
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v0.redis.username}"

        db:
          type: integer
          description: Redis database number
          minimum: 0
          maximum: 15
          default: 0
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v0.redis.db}"

        keyPrefix:
          type: string
          description: Prefix for all Redis keys to avoid conflicts
          default: "ratelimit:v1:"
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v0.redis.key_prefix}"

        failureMode:
          type: string
          description: |
            Behavior when Redis is unavailable. 'open' allows requests through,
            'closed' denies requests. Recommended: 'open' for availability.
          enum: ["open", "closed"]
          default: "open"
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v0.redis.failure_mode}"

        connectionTimeout:
          type: string
          description: Redis connection timeout (Go duration string)
          default: "5s"
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v0.redis.connection_timeout}"

        readTimeout:
          type: string
          description: Redis read timeout (Go duration string)
          default: "3s"
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v0.redis.read_timeout}"

        writeTimeout:
          type: string
          description: Redis write timeout (Go duration string)
          default: "3s"
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v0.redis.write_timeout}"

    memory:
      type: object
      description: In-memory storage configuration (only used when backend=memory)
      additionalProperties: false
      properties:
        maxEntries:
          type: integer
          description: |
            Maximum number of rate limit entries to store in memory.
            Oldest entries are evicted when limit is reached.
          minimum: 100
          maximum: 10000000
          default: 10000
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v0.memory.max_entries}"

        cleanupInterval:
          type: string
          description: |
            Interval for cleaning up expired entries (Go duration string).
            Use "0" to disable periodic cleanup.
          default: "5m"
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v0.memory.cleanup_interval}"

    headers:
      type: object
      description: Control which rate limit headers are included in responses
      additionalProperties: false
      properties:
        includeXRateLimit:
          type: boolean
          description: |
            Include X-RateLimit-* headers (de facto industry standard).
            Headers: X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset
          default: true
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v0.headers.include_x_rate_limit}"

        includeIETF:
          type: boolean
          description: |
            Include IETF RateLimit headers (draft standard).
            Headers: RateLimit-Limit, RateLimit-Remaining, RateLimit-Reset, RateLimit-Policy
          default: true
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v0.headers.include_ietf}"

        includeRetryAfter:
          type: boolean
          description: |
            Include Retry-After header when rate limited (RFC 7231).
            Only set on 429 responses.
          default: true
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v0.headers.include_retry_after}"
