# Redis over TLS with a CA bundle that does not exist. The policy refuses to be built, whatever the
# failure mode, because a TLS misconfiguration is an operator error and not a Redis outage.
[policy_configurations.ratelimit_v1]
algorithm = "fixed-window"
backend = "redis"

[policy_configurations.ratelimit_v1.redis]
host = "redis"
port = 6379
failure_mode = "open"
connection_timeout = "1s"

[policy_configurations.ratelimit_v1.redis.tls]
enabled = true
ca_file = "/etc/policy-engine/certs/missing-ca.pem"
