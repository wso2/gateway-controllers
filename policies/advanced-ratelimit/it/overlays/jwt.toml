# jwt-auth key manager the auth-context scenarios authenticate against.
[[policy_configurations.jwtauth_v1.keymanagers]]
name = "mock-jwks"
issuer = "http://testbench:3001/token"

[policy_configurations.jwtauth_v1.keymanagers.jwks.remote]
uri = "http://testbench:3001/jwks"

# Reads the application identity from client_id, which jwt-auth then publishes in the shared
# metadata under x-wso2-application-id for the metadata key of advanced-ratelimit.
[[policy_configurations.jwtauth_v1.keymanagers]]
name = "mock-jwks-appid"
issuer = "http://testbench:3001/token"
applicationIdClaim = "client_id"

[policy_configurations.jwtauth_v1.keymanagers.jwks.remote]
uri = "http://testbench:3001/jwks"
