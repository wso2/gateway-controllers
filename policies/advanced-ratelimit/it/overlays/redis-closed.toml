# fixed-window over the shared Redis component, failing closed when Redis is unavailable. Short timeouts keep an
# outage from stalling a scenario.
[policy_configurations.ratelimit_v1]
algorithm = "fixed-window"
backend = "redis"

[policy_configurations.ratelimit_v1.redis]
host = "redis"
port = 6379
password = '{{ env "REDIS_PASSWORD" }}'
failure_mode = "closed"
connection_timeout = "1s"
read_timeout = "1s"
write_timeout = "1s"
