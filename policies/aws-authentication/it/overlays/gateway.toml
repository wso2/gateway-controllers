# Non-default Platform Gateway configuration for the aws-authentication-config-overrides block.
# Every setting applies to every runner in that block, so add a setting only when no runner there
# depends on its default, and name the runners that need it.

# aws-authentication-policy-timeout: the gateway answers a request whose policy processing takes
# longer than 5 seconds itself, well before an HTTP client gives up waiting.
[router.policy_engine]
message_timeout_ms = 5000
