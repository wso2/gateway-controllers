# The integration suite of the aws-authentication policy. The scenarios chain basic-ratelimit,
# log-message, json-xml-mediator and set-headers with it. Feature and overlay paths are relative
# to this directory.

suite: aws-authentication

defaults:
  # Blocks that run at once when the suite runs alone. Each block variant boots its own gateway,
  # testbench and database, so they are isolated from each other.
  parallel: 3
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

# Every runner needs Gateway 1.2.0 or later: the policy signs for the upstream the gateway routes
# the request to, and the policy engine of earlier releases does not give a policy that upstream.
blocks:
  # Runners on the default gateway configuration, whose runtime has no AWS workload credentials.
  # They create their own APIs and run at the same time.
  - name: aws-authentication
    parallel: 2
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: aws-authentication-validation
        tags: "gateway-version>=1.2.0"
        features:
          - features/aws_authentication_validation.feature
      - name: aws-authentication
        tags: "gateway-version>=1.2.0;~@known-issue"
        features:
          - features/aws_authentication.feature

  # The restart runner restarts gateway services, which would interrupt any runner beside it, so it
  # gets a block of its own.
  - name: aws-authentication-restart
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: aws-authentication-restart
        tags: "gateway-version>=1.2.0"
        features:
          - features/aws_authentication_restart.feature

  # The overlay makes the gateway answer a request whose policy processing takes longer than 5
  # seconds, and the staged credentials file gives the gateway runtime AWS workload credentials.
  # Both apply to every runner in a block, so these runners get a block of their own.
  - name: aws-authentication-config-overrides
    parallel: 2
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
        overlay: overlays/gateway.toml
        stagedFiles:
          aws-credentials: tests/framework/core/catalog/platformgateway/resources/aws/workload-credentials
      - name: testbench
    runners:
      - name: aws-authentication-workload-credentials
        tags: "gateway-version>=1.2.0"
        features:
          - features/aws_authentication_workload_credentials.feature
      - name: aws-authentication-policy-timeout
        tags: "gateway-version>=1.2.0"
        features:
          - features/aws_authentication_policy_timeout.feature
