# The integration suite of the intelligent-model-routing policy. Feature paths are relative to this directory. Give a
# runner a tags entry, "gateway-version>=X.Y.Z", only when the policy needs a gateway release newer
# than the oldest one tested.

suite: intelligent-model-routing

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: intelligent-model-routing
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
        overlay: overlays/gateway.toml
      - name: testbench
    runners:
      - name: intelligent-model-routing
        features:
          - features/intelligent_model_routing.feature

  # A gateway with no API key: a request routed to the rule's model shows the API's Azure identity
  # authenticated the classifier call, since any classifier failure goes to the default model.
  - name: intelligent-model-routing-identity
    parallel: 1
    components:
      - name: platform-gateway
        overlay: overlays/identity.toml
      - name: testbench
    runners:
      - name: intelligent-model-routing-identity
        features:
          - features/intelligent_model_routing_identity.feature

  # A gateway with a key that allows APIs only workload identity and its own classifier resource.
  - name: intelligent-model-routing-allowlist
    parallel: 1
    components:
      - name: platform-gateway
        overlay: overlays/allowlist.toml
      - name: testbench
    runners:
      - name: intelligent-model-routing-allowlist
        features:
          - features/intelligent_model_routing_allowlist.feature
