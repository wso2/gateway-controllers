# The integration suite of the intelligent-model-routing policy. The policy asks an OpenAI-style
# chat-completions endpoint to classify each request. The testbench openai service stands in for
# that classifier: each of its chat paths answers with a fixed reply, so a scenario picks the
# classifier's answer by pointing llmEndpoint at a path. The overlay supplies the classifier
# settings the policy reads from the gateway configuration. Feature and overlay paths are
# relative to this directory.

suite: intelligent-model-routing

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: intelligent-model-routing
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
        overlay: overlays/gateway.toml
      - name: testbench
    runners:
      - name: intelligent-model-routing
        features:
          - features/intelligent_model_routing.feature
      # Routing to an additional LLM provider needs the named upstreams of gateway 1.2.0.
      - name: intelligent-model-routing-multi-provider
        tags: "gateway-version>=1.2.0"
        features:
          - features/intelligent_model_routing_multi_provider.feature
