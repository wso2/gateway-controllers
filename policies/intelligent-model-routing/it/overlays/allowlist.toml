# A key, but APIs may use only workload identity, and only the testbench resource.
[policy_configurations.intelligent_model_routing_v1]
llm_provider = "AZURE_OPENAI"
llm_provider_endpoint = "http://testbench:3008/openai/deployments/coding/chat/completions?api-version=2024-10-21"
llm_provider_api_key = "sk-testbench-valid-key"
llm_provider_allowed_auth_types = ["workload-identity"]
llm_provider_allowed_endpoints = ["http://testbench:3008"]
