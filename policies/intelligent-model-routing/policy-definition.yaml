name: intelligent-model-routing
version: v0.10.0
description: |
  Routes AI/LLM requests to different models using LLM-powered classification.
  An LLM analyzes each incoming request against user-defined routing rules (each
  with a name and context description) and selects the best-matching model.
  Effective for short keyword-style queries where semantic embeddings may not
  capture intent reliably.

parameters:
  type: object
  propertyNames:
    not:
      enum: [llmAllowedAuthTypes, llmAllowedEndpoints]
  properties:
    contentPath:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        JSONPath expression to extract the user request text from the
        request payload for classification.
      default: "$.messages[-1].content"
    routingRules:
      type: array
      x-wso2-policy-advanced-param: false
      description: |
        List of routing rules. Each rule defines a name, a context
        description for the LLM, and the target model to route to.
      items:
        type: object
        properties:
          name:
            type: string
            description: |
              A label for this rule (e.g. "Weather Information", "Coding Questions").
              The LLM uses this name to identify the matched rule.
            minLength: 1
          context:
            type: string
            description: |
              Plain-language description of the types of requests this rule
              should handle. The LLM reads this when classifying requests.
            minLength: 1
          provider:
            type: string
            description: |
              Optional destination provider. Use the LlmProxy additionalProviders[].as
              alias, or provider id when as is absent. Empty or omitted preserves
              the current upstream (normally the primary provider).
          model:
            type: string
            description: Target AI model name to route matching requests to.
            minLength: 1
        required:
          - name
          - context
          - model
      minItems: 1
    defaultProvider:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        Optional destination provider used with defaultModel on fallback.
        Uses the same alias rules as each route's provider. It is not inherited
        by matched routes that omit provider.
    defaultModel:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        The model to use when no routing rule matches the user request
        or when the LLM returns NONE.
      minLength: 1
    azureAuth:
      type: object
      x-wso2-policy-advanced-param: true
      additionalProperties: false
      description: |
        How this API's classifier call authenticates to Azure OpenAI. Omit it
        to send the API key. The identity types need the AZURE_OPENAI LLM
        provider. The gateway's
        policy_configurations.intelligent_model_routing_v1.llm_provider_allowed_auth_types
        can limit the types an API may use.
      properties:
        authenticationType:
          type: string
          x-wso2-policy-advanced-param: false
          description: |
            "api-key", the default, sends the API key: the API's llmApiKey, or
            the gateway's
            policy_configurations.intelligent_model_routing_v1.llm_provider_api_key.
            The other types send a Microsoft Entra ID access token for the
            gateway's Azure identity instead, and need the AZURE_OPENAI LLM
            provider.
            "workload-identity" uses AKS Workload Identity: the gateway pod runs
            with a service account federated with a Microsoft Entra ID identity.
            "managed-identity" uses a managed identity of the host the gateway
            runs on, from the Azure Instance Metadata Service of a VM, VM scale
            set or AKS node. "container-apps" uses a managed identity of the
            Azure Container Apps app the gateway runs in. The identity needs the
            Cognitive Services OpenAI User role on the Azure OpenAI resource.
          enum:
            - api-key
            - workload-identity
            - managed-identity
            - container-apps
          default: api-key
        clientId:
          type: string
          x-wso2-policy-advanced-param: false
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          description: |
            Application (client) ID of the identity, for the Azure identity
            types. With workload-identity, defaults to AZURE_CLIENT_ID. With
            managed-identity or container-apps, selects a user-assigned identity;
            leave it unset for the host's or app's system-assigned identity.
            Ignored with api-key.
        scope:
          type: string
          x-wso2-policy-advanced-param: false
          pattern: "^\\S+/\\.default$"
          description: |
            Scope of the access token, for the Azure identity types. Defaults to
            "https://cognitiveservices.azure.com/.default". Ignored with api-key.
  required:
    - routingRules
    - defaultModel

systemParameters:
  type: object
  properties:
    llmProvider:
      type: string
      description: |
        LLM provider type for classification: "OPENAI" or "AZURE_OPENAI"
      enum:
        - OPENAI
        - AZURE_OPENAI
      "wso2/defaultValue": "${config.policy_configurations.intelligent_model_routing_v1.llm_provider}"
    llmEndpoint:
      type: string
      description: |
        Endpoint URL for the LLM chat completions API.
        For OpenAI: "https://api.openai.com/v1/chat/completions"
        For Azure OpenAI: Azure OpenAI chat completions endpoint URL
      minLength: 1
      "wso2/defaultValue": "${config.policy_configurations.intelligent_model_routing_v1.llm_provider_endpoint}"
    llmModel:
      type: string
      description: |
        LLM model name for classification (e.g. "gpt-4o-mini").
        Not required for Azure OpenAI (deployment name is in the endpoint URL).
      "wso2/defaultValue": "${config.policy_configurations.intelligent_model_routing_v1.llm_provider_model}"
    llmApiKey:
      type: string
      description: |
        API key for the LLM service. Required in api-key mode, for every
        provider: every API whose azureAuth.authenticationType is api-key, the
        default, sends it unless the API has its own. Not needed when every API
        uses an Azure identity.
      minLength: 1
      "wso2/defaultValue": "${config.policy_configurations.intelligent_model_routing_v1.llm_provider_api_key}"
    llmAllowedAuthTypes:
      type: array
      items:
        type: string
        enum:
          - api-key
          - workload-identity
          - managed-identity
          - container-apps
      description: |
        If non-empty, the authentication types this gateway's APIs may choose
        in azureAuth.authenticationType. An API without azureAuth uses api-key
        and is checked as such. Leave out api-key to stop APIs sending the key;
        list only api-key to keep them off the gateway's Azure identities. Empty
        (the default) places no limit.
      "wso2/defaultValue": "${config.policy_configurations.intelligent_model_routing_v1.llm_provider_allowed_auth_types}"
    llmAllowedEndpoints:
      type: array
      items:
        type: string
      description: |
        If non-empty, the LLM resources this gateway's APIs may call,
        including the gateway's own
        policy_configurations.intelligent_model_routing_v1.llm_provider_endpoint.
        Entries are resource URLs, such as https://<resource>.openai.azure.com,
        with no path, query or fragment. They are matched on scheme, host and
        port, ignoring case, against the endpoint an API uses, its own or the
        gateway's, so the gateway's key and tokens for its Azure identity are
        only sent to listed resources. Any deployment on a listed resource is
        allowed. Empty (the default) places no limit.
      "wso2/defaultValue": "${config.policy_configurations.intelligent_model_routing_v1.llm_provider_allowed_endpoints}"
    requestModel:
      type: object
      description: |
        Specifies where the model name appears in the request so the policy
        can replace it with the selected model.
      properties:
        location:
          type: string
          enum:
            - payload
        identifier:
          type: string
          description: |
            JSONPath identifying the model field in the request body.
      required:
        - location
        - identifier
  required:
    - llmProvider
    - llmEndpoint
    - requestModel
