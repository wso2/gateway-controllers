suite: api-key-auth

defaults:
  parallel: 4
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: api-key-auth
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
        addPoliciesFrom: policies
      - name: testbench
    runners:
      - name: api-key-auth
        tags: "gateway-version>=1.1.0"
        features:
          - features/api_key_auth.feature

  - name: api-key-auth-restart
    parallel: 1
    components:
      - name: platform-gateway
        overlay: overlays/policy-engine-message-timeout.toml
        db:
          matrix: [sqlite, postgres, sqlserver]
        addPoliciesFrom: policies
      - name: testbench
    runners:
      - name: api-key-auth-restart
        tags: "gateway-version>=1.1.0"
        features:
          - features/api_key_auth_restart.feature

  - name: api-key-auth-multigateway
    parallel: 1
    components:
      - name: platform-api
        version: latest
        db: sqlite
      - name: platform-gateway
        dependsOn: [platform-api]
        replicas: 2
        db: sqlite
        addPoliciesFrom: policies
      - name: testbench
    runners:
      - name: api-key-auth-multigateway
        tags: "gateway-version>=1.1.0"
        features:
          - features/api_key_auth_multigateway.feature
