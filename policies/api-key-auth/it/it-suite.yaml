# The integration suite of the api-key-auth policy. The gateway under test is built from this policy and
# the policies the gateway controller requires (tests/it/common/suite), staged as the policy tree
# that addPoliciesFrom names. Feature paths are relative to this directory. Give a runner a tags
# entry, "gateway-version>=X.Y.Z", only when the policy needs a gateway release newer than the
# oldest one tested.

suite: api-key-auth

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: api-key-auth
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
        addPoliciesFrom: policies
      - name: testbench
    runners:
      - name: api-key-auth
        features:
          - features/api_key_auth_error_compatibility.feature
