name: api-key-auth
version: v0.1.1
description: |
  Protects APIs with pre-shared API keys.
  Validates keys from headers or query parameters and writes authentication metadata to the request context.

parameters:
  type: object
  additionalProperties: false
  properties:
    key:
      type: string
      description: |
        Header or query parameter name that carries the API key.
      minLength: 1
      maxLength: 128

    in:
      type: string
      description: |
        Location to read the API key from: `header` or `query`.
      enum:
        - "header"
        - "query"

    value-prefix:
      type: string
      description: |
        Optional prefix to strip from the extracted API key before validation (for example `Bearer `).
      minLength: 1
      maxLength: 64

  required:
    - key
    - in

systemParameters:
  type: object
  properties: {}
