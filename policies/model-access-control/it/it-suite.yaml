# The integration suite of the model-access-control policy. Feature paths are relative to this
# directory.
#
# The runner deploys LLM providers and proxies with operation-level policy attachments, which
# receive requestModel from the provider template on gateway 1.2.0 and later.

suite: model-access-control

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: model-access-control
    parallel: 3
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: model-access-control
        tags: "gateway-version>=1.2.0"
        features:
          - features/model_access_control.feature
      - name: model-access-control-locations
        tags: "gateway-version>=1.2.0"
        features:
          - features/model_access_control_locations.feature
      - name: model-access-control-hardening
        tags: "gateway-version>=1.2.0"
        features:
          - features/model_access_control_hardening.feature
