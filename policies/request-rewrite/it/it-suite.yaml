# The integration suite of the request-rewrite policy. Feature paths are relative to this directory.
# Give a runner a tags entry, "gateway-version>=X.Y.Z", only when the policy needs a gateway release
# newer than the oldest one tested.

suite: request-rewrite

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: request-rewrite
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: request-rewrite-path
        tags: "gateway-version>=1.2.0"
        features:
          - features/request_rewrite_path.feature
      # Gateway 1.1.0 forwards a rewritten path of an operation ending in /* with the API context
      # instead of the upstream base path (wso2/api-platform#2071, fixed in 1.2.0 by
      # wso2/api-platform#2072), so scenarios tagged @known-issue-gw-1.1.0 are skipped there.
      - name: request-rewrite-path-gw-1.1.0
        tags: "gateway-version<1.2.0;~@known-issue-gw-1.1.0"
        features:
          - features/request_rewrite_path.feature
      - name: request-rewrite-query
        features:
          - features/request_rewrite_query.feature
      - name: request-rewrite-method
        features:
          - features/request_rewrite_method.feature
      - name: request-rewrite-matching
        features:
          - features/request_rewrite_matching.feature
      - name: request-rewrite-scope
        tags: "gateway-version>=1.2.0"
        features:
          - features/request_rewrite_scope.feature
      # Gateway 1.1.0 sends a dynamic endpoint's request under the API's own upstream base path
      # instead of the target upstream definition's (fixed in 1.2.0 by wso2/api-platform#2000), so
      # scenarios tagged @known-issue-gw-1.1.0 are skipped there.
      - name: request-rewrite-scope-gw-1.1.0
        tags: "gateway-version<1.2.0;~@known-issue-gw-1.1.0"
        features:
          - features/request_rewrite_scope.feature
      - name: request-rewrite-security
        features:
          - features/request_rewrite_security.feature
      - name: request-rewrite-lifecycle
        features:
          - features/request_rewrite_lifecycle.feature
      - name: request-rewrite-validation
        features:
          - features/request_rewrite_validation.feature
      - name: request-rewrite-restart
        features:
          - features/request_rewrite_restart.feature
