name: prompt-decorator
version: v0.1.0
description: |
  Modifies prompts by applying configured decorations to request payloads.

parameters:
  type: object
  properties:
    promptDecoratorConfig:
      anyOf:
        - type: string
          minLength: 1
        - type: object
      description: |
        Prompt decoration configuration as a JSON string or object.
    jsonPath:
      type: string
      description: JSONPath selecting the prompt section to modify.
      minLength: 1
    append:
      type: boolean
      description: If true, appends decorated content; otherwise prepends it.
      default: false
  required:
    - promptDecoratorConfig
    - jsonPath

systemParameters:
  type: object
  properties: {}
