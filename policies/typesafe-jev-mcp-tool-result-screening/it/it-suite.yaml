# The integration suite of the typesafe-jev-mcp-tool-result-screening policy. The gateway under test is built from this policy and
# the policies the gateway controller requires, staged as the policy tree that addPoliciesFrom
# names, with mcp-rewrite and typesafe-jev-mcp-tool-intent-verification, which the scenarios chain with it. The testbench jev service stands in for TypeSafe's Jev API; the
# typesafe-jev overlay points the policy's default base URL at it. Feature and overlay paths are
# relative to this directory.

suite: typesafe-jev-mcp-tool-result-screening

defaults:
  # Blocks that run at once. Each block variant boots its own gateway, testbench and database,
  # so they are isolated from each other.
  parallel: 3
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  # One runner at a time: monitor-mode scenarios read the block's shared analytics collector.
  - name: typesafe-jev-mcp-tool-result-screening
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
        addPoliciesFrom: policies
        overlay: overlays/typesafe-jev.toml
      - name: testbench
    runners:
      - name: typesafe-jev-mcp-tool-result-screening
        features:
          - features/typesafe_jev_mcp_tool_result_screening.feature
