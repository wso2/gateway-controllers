name: analytics-header-filter
version: v0.1.0
description: |
  Controls which request and response headers are sent to analytics using allow or deny modes.
  Only analytics data is affected; request and response headers themselves are not modified.
  Request and response can be configured independently.

parameters:
  type: object
  properties:
    requestHeadersToFilter:
      type: object
      description: Request header filter configuration.
      properties:
        operation:
          type: string
          description: |
            Request filter mode: `allow` includes only listed headers; `deny` excludes listed headers.
          enum:
            - allow
            - deny
        headers:
          type: array
          description: Request header names used by the selected `operation`.
          items:
            type: string
            minLength: 1
            maxLength: 256
          default: []
      required:
        - operation
        - headers
    responseHeadersToFilter:
      type: object
      description: Response header filter configuration.
      properties:
        operation:
          type: string
          description: |
            Response filter mode: `allow` includes only listed headers; `deny` excludes listed headers.
          enum:
            - allow
            - deny
        headers:
          type: array
          description: Response header names used by the selected `operation`.
          items:
            type: string
            minLength: 1
            maxLength: 256
          default: []
      required:
        - operation
        - headers
  required: []

systemParameters:
  type: object
  properties: {}
