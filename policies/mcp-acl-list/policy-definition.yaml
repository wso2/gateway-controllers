name: mcp-acl-list
version: v0.1.0
description: |
  Controls access to MCP tools, resources, and prompts using allow/deny mode with exceptions.
  Applies the same rules to list responses and request paths.
  Does not rewrite capability fields or modify list entry content.

parameters:
  type: object
  additionalProperties: false
  properties:
    tools:
      type: object
      additionalProperties: false
      description: |
        ACL configuration for tools. Use mode and exceptions to allow or deny tools.
      required:
        - mode
      properties:
        mode:
          type: string
          description: ACL mode for tools.
          enum:
            - allow
            - deny
        exceptions:
          type: array
          description: List of tool names that are exceptions to the mode.
          items:
            type: string
            description: Tool name to include as an exception.
            minLength: 1
            maxLength: 256
    resources:
      type: object
      additionalProperties: false
      description: |
        ACL configuration for resources. Use mode and exceptions to allow or deny resources.
      required:
        - mode
      properties:
        mode:
          type: string
          description: ACL mode for resources.
          enum:
            - allow
            - deny
        exceptions:
          type: array
          description: List of resource URIs that are exceptions to the mode.
          items:
            type: string
            description: Resource URI to include as an exception.
            minLength: 1
            maxLength: 2048
    prompts:
      type: object
      additionalProperties: false
      description: |
        ACL configuration for prompts. Use mode and exceptions to allow or deny prompts.
      required:
        - mode
      properties:
        mode:
          type: string
          description: ACL mode for prompts.
          enum:
            - allow
            - deny
        exceptions:
          type: array
          description: List of prompt names that are exceptions to the mode.
          items:
            type: string
            description: Prompt name to include as an exception.
            minLength: 1
            maxLength: 256

systemParameters:
  type: object
  properties: {}
