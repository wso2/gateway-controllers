# The integration suite of the llm-cost policy. Feature paths are relative to this directory. Give a
# runner a tags entry, "gateway-version>=X.Y.Z", only when the policy needs a gateway release newer
# than the oldest one tested.
#
# The llm-cost block runs on the gateway's own pricing file, so its costs follow the shipped rates.
# The llm-cost-staged block stages a pricing file whose rates this suite controls (overlays/pricing/),
# so its scenarios assert exact costs through analytics. The remaining blocks each give the policy an
# unusable pricing file, which fails the policy when the gateway builds a route's policy chain.

suite: llm-cost

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: llm-cost
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: llm-cost-calculation-providers
        tags: "gateway-version>1.2.0"
        features:
          - features/llm_cost_calculation_providers.feature
      - name: llm-cost-calculation-providers-gw-1.2.0
        tags: "gateway-version=1.2.0;~@known-issue-gw-1.2.0"
        features:
          - features/llm_cost_calculation_providers.feature
      - name: llm-cost-calculation-providers-gw-1.1.0
        tags: "gateway-version<1.2.0;~@known-issue-gw-1.2.0 && ~@known-issue-gw-1.1.0"
        features:
          - features/llm_cost_calculation_providers.feature

  - name: llm-cost-staged
    parallel: 4
    components:
      - name: platform-gateway
        overlay: overlays/gateway.toml
        stagedFiles:
          # Written for this suite: test rates, not the gateway's shipped prices.
          llm-pricing/model_prices.json: overlays/pricing/model_prices.json
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: llm-cost-model-resolution
        tags: "gateway-version>=1.2.0"
        features:
          - features/llm_cost_model_resolution.feature
      - name: llm-cost-model-resolution-gw-1.1.0
        tags: "gateway-version<1.2.0;~@known-issue-gw-1.1.0"
        features:
          - features/llm_cost_model_resolution.feature
      - name: llm-cost-usage
        tags: "gateway-version>1.2.0"
        features:
          - features/llm_cost_usage.feature
      - name: llm-cost-usage-gw-1.2.0-and-earlier
        tags: "gateway-version<=1.2.0;~@known-issue-gw-1.2.0"
        features:
          - features/llm_cost_usage.feature
      - name: llm-cost-streaming
        tags: "gateway-version>1.2.0"
        features:
          - features/llm_cost_streaming.feature
      - name: llm-cost-streaming-gw-1.2.0-and-earlier
        tags: "gateway-version<=1.2.0;~@known-issue-gw-1.2.0"
        features:
          - features/llm_cost_streaming.feature
      - name: llm-cost-routes
        tags: "gateway-version>=1.1.0"
        features:
          - features/llm_cost_routes.feature
      - name: llm-cost-upstream-errors
        tags: "gateway-version>=1.1.0"
        features:
          - features/llm_cost_upstream_errors.feature
      - name: llm-cost-bedrock-transformer
        tags: "gateway-version>=1.2.0"
        features:
          - features/llm_cost_bedrock_transformer.feature
      - name: llm-cost-logging
        tags: "gateway-version>=1.1.0"
        features:
          - features/llm_cost_logging.feature

  - name: llm-cost-pricing-file-missing
    components:
      - name: platform-gateway
        overlay: overlays/pricing-file-missing.toml
      - name: testbench
    runners:
      - name: llm-cost-pricing-file-missing
        tags: "gateway-version>=1.1.0"
        features:
          - features/llm_cost_pricing_file_missing.feature

  - name: llm-cost-pricing-file-malformed
    components:
      - name: platform-gateway
        overlay: overlays/pricing-file-malformed.toml
        stagedFiles:
          llm-pricing/model_prices.json: overlays/pricing/malformed.json
      - name: testbench
    runners:
      - name: llm-cost-pricing-file-malformed
        tags: "gateway-version>=1.1.0"
        features:
          - features/llm_cost_pricing_file_malformed.feature

  - name: llm-cost-pricing-file-traversal
    components:
      - name: platform-gateway
        overlay: overlays/pricing-file-traversal.toml
      - name: testbench
    runners:
      - name: llm-cost-pricing-file-traversal
        tags: "gateway-version>=1.1.0"
        features:
          - features/llm_cost_pricing_file_traversal.feature

  - name: llm-cost-pricing-file-sensitive
    components:
      - name: platform-gateway
        overlay: overlays/pricing-file-sensitive.toml
      - name: testbench
    runners:
      - name: llm-cost-pricing-file-sensitive
        tags: "gateway-version>=1.1.0"
        features:
          - features/llm_cost_pricing_file_sensitive.feature

  - name: llm-cost-pricing-file-no-entries
    components:
      - name: platform-gateway
        overlay: overlays/pricing-file-no-entries.toml
        stagedFiles:
          llm-pricing/model_prices.json: overlays/pricing/no-entries.json
      - name: testbench
    runners:
      - name: llm-cost-pricing-file-no-entries
        tags: "gateway-version>=1.1.0"
        features:
          - features/llm_cost_pricing_file_no_entries.feature

  - name: llm-cost-pricing-file-empty
    components:
      - name: platform-gateway
        overlay: overlays/pricing-file-empty.toml
      - name: testbench
    runners:
      - name: llm-cost-pricing-file-empty
        tags: "gateway-version>=1.1.0"
        features:
          - features/llm_cost_pricing_file_empty.feature

  - name: llm-cost-pricing-file-not-string
    components:
      - name: platform-gateway
        overlay: overlays/pricing-file-not-string.toml
      - name: testbench
    runners:
      - name: llm-cost-pricing-file-not-string
        tags: "gateway-version>=1.1.0"
        features:
          - features/llm_cost_pricing_file_not_string.feature
