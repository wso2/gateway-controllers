# The policy's gateway settings. switchyardEndpoint is required and resolved from this file before a
# scenario's params apply, so the gateway needs a value even though each scenario sets its own.
# Port 1 on the testbench refuses connections, so a scenario that keeps it gets no decision.
[policy_configurations.nvidia_switchyard_router_v0]
switchyard_endpoint = "http://testbench:1/v1/decision"
switchyard_api_key = ""
switchyard_timeout = "2s"
