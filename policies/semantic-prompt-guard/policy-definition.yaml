name: semantic-prompt-guard
version: v1.2.0
description: |
  Evaluates request prompts using embedding similarity against configured allow
  and deny phrases. Blocks prompts that match denied phrases or fail allow
  checks, with optional JSONPath extraction and configurable response detail.

parameters:
  type: object
  propertyNames:
    not:
      enum: [embeddingAllowedAuthTypes, embeddingAllowedEndpoints]
  properties:
    jsonPath:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        Specifies the JSONPath used to extract prompt text from JSON payloads.
        When empty, the entire payload is evaluated as plain text.
      default: "$.messages[-1].content"
    azureAuth:
      type: object
      x-wso2-policy-advanced-param: true
      additionalProperties: false
      description: |
        How this API's embedding calls authenticate to Azure OpenAI. Omit it to
        send the API key. The identity types need the AZURE_OPENAI embedding
        provider. The gateway's embedding_provider_allowed_auth_types can limit
        the types an API may use.
      properties:
        authenticationType:
          type: string
          x-wso2-policy-advanced-param: false
          description: |
            "api-key", the default, sends the API key: the API's apiKey, or the
            gateway's embedding_provider_api_key. The other types send a
            Microsoft Entra ID access token for the gateway's Azure identity
            instead, and need the AZURE_OPENAI embedding provider.
            "workload-identity" uses AKS Workload Identity: the gateway pod runs
            with a service account federated with a Microsoft Entra ID identity.
            "managed-identity" uses a managed identity of the host the gateway
            runs on, from the Azure Instance Metadata Service of a VM, VM scale
            set or AKS node. "container-apps" uses a managed identity of the
            Azure Container Apps app the gateway runs in. The identity needs the
            Cognitive Services OpenAI User role on the Azure OpenAI resource.
          enum:
            - api-key
            - workload-identity
            - managed-identity
            - container-apps
          default: api-key
        clientId:
          type: string
          x-wso2-policy-advanced-param: false
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          description: |
            Application (client) ID of the identity, for the Azure identity
            types. With workload-identity, defaults to AZURE_CLIENT_ID. With
            managed-identity or container-apps, selects a user-assigned identity;
            leave it unset for the host's or app's system-assigned identity.
            Ignored with api-key, but a value that is set must still be a GUID.
        scope:
          type: string
          x-wso2-policy-advanced-param: false
          pattern: "^\\S+/\\.default$"
          description: |
            Scope of the access token, for the Azure identity types. Defaults to
            "https://cognitiveservices.azure.com/.default". Ignored with api-key,
            but a value that is set must still end in /.default.
    allowSimilarityThreshold:
      type: number
      x-wso2-policy-advanced-param: true
      description: |
        Specifies the minimum similarity score (0.0 to 1.0) required to match
        an allowed phrase.
      default: 0.65
      minimum: 0.0
      maximum: 1.0
    denySimilarityThreshold:
      type: number
      x-wso2-policy-advanced-param: true
      description: |
        Specifies the similarity score (0.0 to 1.0) at or above which a denied
        phrase blocks the request.
      default: 0.65
      minimum: 0.0
      maximum: 1.0
    allowedPhrases:
      type: array
      description: |
        Specifies phrases treated as allowed references for semantic comparison
        during request validation.
      default: []
      items:
        type: string
        description: Specifies a phrase to allow.
    deniedPhrases:
      type: array
      description: |
        Specifies phrases treated as denied references for semantic comparison
        during request validation.
      default: []
      items:
        type: string
        description: Specifies a phrase to deny.
    showAssessment:
      type: boolean
      x-wso2-policy-advanced-param: true
      description: |
        Specifies whether blocked responses include detailed assessment
        information.
      default: false
  oneOf:
    - required:
      - allowedPhrases
      not:
        required:
        - deniedPhrases
    - required:
      - deniedPhrases
      not:
        required:
        - allowedPhrases
    - required:
      - allowedPhrases
      - deniedPhrases

systemParameters:
  type: object
  properties:
    embeddingProvider:
      type: string
      description: |
        Embedding provider to use. Supported: AZURE_OPENAI, OPENAI, MISTRAL.
      enum:
        - AZURE_OPENAI
        - OPENAI
        - MISTRAL
      default: AZURE_OPENAI
      "wso2/defaultValue": "${config.embedding_provider}"
    embeddingEndpoint:
      type: string
      description: |
        HTTP endpoint for the embedding provider. For Azure OpenAI, this should be
        the base endpoint (e.g., https://myres.openai.azure.com).
        For OpenAI: "https://api.openai.com/v1/embeddings"
        For Mistral: "https://api.mistral.ai/v1/embeddings"
      minLength: 1
      "wso2/defaultValue": "${config.embedding_provider_endpoint}"
    embeddingModel:
      type: string
      description: |
        Embedding model name (required for OPENAI, MISTRAL; not required for AZURE_OPENAI)
        For OpenAI: "text-embedding-ada-002" or "text-embedding-3-small"
        For Mistral: "mistral-embed"
        For Azure OpenAI: Not required (deployment name is in the endpoint URL)
      "wso2/defaultValue": "${config.embedding_provider_model}"
    apiKey:
      type: string
      description: |
        API key for the embedding provider. Required in api-key mode, for every
        provider: every API whose azureAuth.authenticationType is api-key, the
        default, sends it unless the API has its own. Not needed when every API
        uses an Azure identity.
      minLength: 1
      "wso2/defaultValue": "${config.embedding_provider_api_key}"
    embeddingAllowedAuthTypes:
      type: array
      items:
        type: string
        enum:
          - api-key
          - workload-identity
          - managed-identity
          - container-apps
      description: |
        If non-empty, the authentication types this gateway's APIs may choose
        in azureAuth.authenticationType. An API without azureAuth uses api-key
        and is checked as such. Leave out api-key to stop APIs sending the key;
        list only api-key to keep them off the gateway's Azure identities. Empty
        (the default) places no limit.
      "wso2/defaultValue": "${config.embedding_provider_allowed_auth_types}"
    embeddingAllowedEndpoints:
      type: array
      items:
        type: string
      description: |
        If non-empty, the embedding resources this gateway's APIs may call,
        including the resource of the gateway's own embedding_provider_endpoint. Entries are
        resource URLs, such as https://<resource>.openai.azure.com, with no
        path, query or fragment. They are matched on scheme, host and port,
        ignoring case, against the endpoint an API uses, its own or the
        gateway's, so the gateway's key and tokens for its Azure identity are
        only sent to listed resources. Any deployment on a listed resource is
        allowed. Empty (the default) places no limit.
      "wso2/defaultValue": "${config.embedding_provider_allowed_endpoints}"
  required:
    - embeddingProvider
    - embeddingEndpoint
