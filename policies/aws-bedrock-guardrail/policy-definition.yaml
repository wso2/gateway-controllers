name: aws-bedrock-guardrail
version: v1.1.1
description: |
  Validate request or response content with AWS Bedrock Guardrails.

parameters:
  type: object
  properties:
    localGuardrailID:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        AWS Bedrock Guardrail identifier for this policy attachment. Leave
        unset to use the gateway-wide system parameter instead.
      minLength: 1
    localGuardrailVersion:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        AWS Bedrock Guardrail version (e.g., "DRAFT", "1") for this policy
        attachment. Leave unset to use the gateway-wide system parameter instead.
      minLength: 1
    request:
      type: object
      description: Configuration for request phase validation
      properties:
        enabled:
          type: boolean
          x-wso2-policy-advanced-param: false
          description: |
            Enables validation for the request flow.
          default: true
        jsonPath:
          type: string
          x-wso2-policy-advanced-param: false
          description: |
            JSONPath expression to extract a specific value from JSON payload.
          default: "$.messages[-1].content"
        redactPII:
          type: boolean
          x-wso2-policy-advanced-param: true
          description: |
            If true, redacts PII by replacing with "*****".
            If false (default), masks PII with placeholders that can be restored in responses.
          default: false
        passthroughOnError:
          type: boolean
          x-wso2-policy-advanced-param: true
          description: |
            If true, allows requests to proceed if AWS Bedrock Guardrail API call fails.
            If false (default), blocks requests on API errors.
          default: false
        showAssessment:
          type: boolean
          x-wso2-policy-advanced-param: true
          description: |
            If true, includes detailed assessment information from AWS Bedrock Guardrail in error responses.
            If false, returns minimal error information.
          default: false
    response:
      type: object
      description: Configuration for response phase validation
      properties:
        enabled:
          type: boolean
          x-wso2-policy-advanced-param: false
          description: |
            Enables validation for the response flow.
          default: false
        jsonPath:
          type: string
          x-wso2-policy-advanced-param: false
          description: |
            JSONPath expression to extract a specific value from JSON payload.
          default: "$.choices[0].message.content"
        passthroughOnError:
          type: boolean
          x-wso2-policy-advanced-param: true
          description: |
            If true, allows responses to proceed if AWS Bedrock Guardrail API call fails.
            If false (default), blocks responses on API errors.
          default: false
        showAssessment:
          type: boolean
          x-wso2-policy-advanced-param: true
          description: |
            If true, includes detailed assessment information from AWS Bedrock Guardrail in error responses.
            If false, returns minimal error information.
          default: false
        streaming:
          type: boolean
          x-wso2-policy-advanced-param: false
          description: |
            If true, validates a streamed response incrementally so tokens reach
            the client as they arrive. If false (default), the whole response is
            buffered and validated once.
            Enable this only for an API whose responses are streamed
            (stream: true / text/event-stream). Two consequences to weigh:
            a violation found after the first tokens have been delivered cannot
            be answered with a 422 — the stream ends with an error event and the
            text already sent stays sent; and the guardrail is called once per
            window instead of once per response, so AWS cost scales with
            response length.
          default: false
        streamingJsonPath:
          type: string
          x-wso2-policy-advanced-param: false
          description: |
            JSONPath expression locating the assistant text inside one streamed
            event. Applies only when streaming is true, and is separate from
            jsonPath because a streamed response carries text incrementally
            under a different field than a buffered one. The default suits the
            OpenAI streaming format, which is also what the
            openai-to-bedrock-transformer emits.
          default: "$.choices[0].delta.content"
        streamingWindowBytes:
          type: integer
          x-wso2-policy-advanced-param: true
          description: |
            How many bytes of the streamed response to accumulate before each
            AWS Bedrock Guardrail call. Applies only when streaming is true.
            A smaller window detects a violation sooner and blocks less text,
            at more AWS calls and a round trip between smaller groups of tokens;
            a larger window costs less and streams more smoothly, but more text
            reaches the client before it is validated.
          minimum: 256
          default: 2048
  anyOf:
    - required: [ request ]
    - required: [ response ]

systemParameters:
  type: object
  additionalProperties: false
  properties:
    region:
      type: string
      description: AWS region where the Bedrock Guardrail is located (e.g., "us-east-1").
      minLength: 1
      "wso2/defaultValue": "${config.awsbedrock_guardrail_region}"
    guardrailID:
      type: string
      description: AWS Bedrock Guardrail identifier.
      minLength: 1
      "wso2/defaultValue": "${config.awsbedrock_guardrail_id}"
    guardrailVersion:
      type: string
      description: AWS Bedrock Guardrail version (e.g., "DRAFT", "1").
      minLength: 1
      "wso2/defaultValue": "${config.awsbedrock_guardrail_version}"
    awsAccessKeyID:
      type: string
      description: AWS access key ID (for static credentials or role assumption). If omitted, runtime uses default credential chain.
      minLength: 1
      "wso2/defaultValue": "${config.awsbedrock_access_key_id}"
    awsSecretAccessKey:
      type: string
      description: AWS secret access key (for static credentials or role assumption). If omitted, runtime uses default credential chain.
      minLength: 1
      "wso2/defaultValue": "${config.awsbedrock_secret_access_key}"
    awsSessionToken:
      type: string
      description: AWS session token (optional, for temporary credentials).
      minLength: 1
      "wso2/defaultValue": "${config.awsbedrock_session_token}"
    awsRoleARN:
      type: string
      description: AWS IAM role ARN to assume (for role-based authentication). If specified, runtime assumes this role instead of using static credentials.
      "wso2/defaultValue": "${config.awsbedrock_role_arn}"
    awsRoleRegion:
      type: string
      description: AWS region for role assumption (required if awsRoleARN is specified).
      "wso2/defaultValue": "${config.awsbedrock_role_region}"
    awsRoleExternalID:
      type: string
      description: External ID for role assumption (optional, for cross-account access).
      minLength: 1
      "wso2/defaultValue": "${config.awsbedrock_role_external_id}"
  required:
    - region
