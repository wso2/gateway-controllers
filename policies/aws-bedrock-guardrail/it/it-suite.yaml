# The integration suite of the aws-bedrock-guardrail policy. Feature paths are relative to this
# directory. Give a runner a tags entry, "gateway-version>=X.Y.Z", only when the policy needs a
# gateway release newer than the oldest one tested.

suite: aws-bedrock-guardrail

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: aws-bedrock-guardrail
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
        overlay: overlays/gateway.toml
      - name: testbench
    runners:
      - name: aws-bedrock-guardrail-legacy
        tags: "gateway-version<=1.2.0"
        features:
          - features/aws_bedrock_guardrail.feature
      - name: aws-bedrock-guardrail
        features:
          - features/aws_bedrock_guardrail_error_compatibility.feature
  - name: aws-bedrock-guardrail-default
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: aws-bedrock-guardrail
        tags: "gateway-version>1.2.0"
        features:
          - features/aws_bedrock_guardrail.feature
