# The integration suite of the mcp-ratelimit policy. Feature paths are relative to this directory.
# Give a runner a tags entry, "gateway-version>=X.Y.Z", only when the policy needs a gateway release
# newer than the oldest one tested.

suite: mcp-ratelimit

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  - name: mcp-ratelimit
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: mcp-ratelimit-policy
        tags: "gateway-version>1.2.0"
        features:
          - features/mcp_ratelimit.feature
      - name: mcp-ratelimit
        tags: "gateway-version>=1.2.0"
        features:
          - features/mcp_ratelimit_error_compatibility.feature
