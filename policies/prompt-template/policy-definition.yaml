name: prompt-template
version: v0.1.0
description: |
  Applies configured prompt templates to request payloads.

parameters:
  type: object
  properties:
    promptTemplateConfig:
      type: string
      description: |
        JSON string defining one or more prompt templates.
        Each template should include `name` and `prompt`.
      minLength: 1
  required:
    - promptTemplateConfig

systemParameters:
  type: object
  properties: {}
