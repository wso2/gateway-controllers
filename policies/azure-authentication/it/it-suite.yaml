# The integration suite of the azure-authentication policy. The gateway runtime has the Azure
# Workload Identity the test framework gives it (AZURE_* variables and a fixture federated token),
# and the testbench entra service stands in for Microsoft Entra ID and the Entra-protected Azure
# services. Feature paths are relative to this directory.

suite: azure-authentication

defaults:
  # Blocks that run at once when the suite runs alone. Each block variant boots its own gateway,
  # testbench and database, so they are isolated from each other.
  parallel: 3
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

# No runner has a gateway-version tag: REST API scenarios run on every gateway tested, and the
# LLM provider scenarios, which need upstream.auth type other (gateways after 1.2.0), each start
# with a gateway version step.
blocks:
  # Runners on the default gateway configuration. They create their own APIs, and every scenario
  # that counts token requests names its own Entra tenant or managed identity, so they run at the
  # same time.
  - name: azure-authentication
    parallel: 2
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: azure-authentication-validation
        features:
          - features/azure_authentication_validation.feature
      - name: azure-authentication
        features:
          - features/azure_authentication.feature
      - name: azure-authentication-managed-identity
        features:
          - features/azure_authentication_managed_identity.feature

  # The restart runner restarts gateway services, which would interrupt any runner beside it, so it
  # gets a block of its own.
  - name: azure-authentication-restart
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: azure-authentication-restart
        features:
          - features/azure_authentication_restart.feature

  # The staged token file gives the gateway runtime an empty federated service account token, a
  # setting that applies to every runner in a block, so this runner gets a block of its own.
  - name: azure-authentication-token-file
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
        stagedFiles:
          azure-identity-token: tests/framework/core/catalog/platformgateway/resources/azure/identity-token-empty
      - name: testbench
    runners:
      - name: azure-authentication-token-file
        features:
          - features/azure_authentication_token_file.feature
