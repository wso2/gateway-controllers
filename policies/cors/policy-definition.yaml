name: cors
version: v1.1.0
description: |
  Applies Cross-Origin Resource Sharing (CORS) rules by handling preflight
  requests and adding CORS headers to responses. Controls cross-origin access
  through configured origins, methods, headers, credentials, and cache settings.
  Optionally rejects requests from disallowed (or missing) origins with 403,
  which also protects WebSocket APIs against cross-site WebSocket hijacking.

parameters:
  type: object
  properties:
    allowedOrigins:
      type: array
      x-wso2-policy-advanced-param: false
      description:
        Specifies allowed origins for cross-origin access. Supports "*", exact
        origins, and subdomain wildcards such as "https://*.example.com".
        Subdomain wildcards require and match only their configured scheme,
        allow any subdomain depth, exclude the apex domain, and only match a
        port when one is explicitly configured. Exact origins are matched
        literally. At least one origin is required; otherwise cross-origin
        requests are rejected.
      default:
        - "*"
      items:
        type: string
        minLength: 1
        maxLength: 2048
      minItems: 1
    allowedMethods:
      type: array
      x-wso2-policy-advanced-param: true
      description:
        Specifies allowed HTTP methods for cross-origin requests, such as GET,
        POST, PUT, DELETE, PATCH, OPTIONS, and HEAD.
      items:
        type: string
        enum:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
          - HEAD
          - "*"
      minItems: 1
      default:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
    allowedHeaders:
      type: array
      x-wso2-policy-advanced-param: true
      description:
        Specifies request headers allowed in cross-origin requests. Supports "*"
        to allow all headers or explicit header names.
      default: []
      items:
        type: string
        minLength: 1
        maxLength: 256
    exposedHeaders:
      type: array
      x-wso2-policy-advanced-param: true
      description:
        Specifies response headers exposed to browser JavaScript in
        cross-origin responses.
      items:
        type: string
        minLength: 1
        maxLength: 256
      default: []
    allowCredentials:
      type: boolean
      x-wso2-policy-advanced-param: true
      description: Specifies whether credentials are allowed in cross-origin requests.
        When true, allowedOrigins cannot contain the global "*" wildcard.
      default: false
    maxAge:
      type: integer
      x-wso2-policy-advanced-param: true
      description: Specifies how long, in seconds, browsers can cache preflight responses.
      minimum: 0
      maximum: 86400
      default: 3600
    forwardPreflight:
      type: boolean
      x-wso2-policy-advanced-param: true
      description: Specifies whether unmatched preflight requests are forwarded
        upstream instead of handled by this policy.
      default: false
    rejectDisallowedOrigins:
      type: boolean
      x-wso2-policy-advanced-param: true
      description: >
        When true, a non-preflight request whose Origin is not in allowedOrigins
        is rejected with 403 instead of being forwarded without CORS headers.
        Browsers apply CORS only to what a page may read, and never to a
        WebSocket handshake, so enable this to stop pages on other origins from
        using a user's cookies against the API (cross-site WebSocket hijacking).
        Requires allowedOrigins to list origins rather than "*"; each entry must
        then be scheme://host[:port] (or https://*.example.com), and "null" is
        refused. Requests without an Origin header are still allowed unless
        rejectMissingOrigin is set.
      default: false
    rejectMissingOrigin:
      type: boolean
      x-wso2-policy-advanced-param: true
      description: >
        When true, a non-preflight request with no Origin header is rejected with
        403. Browsers always send Origin on a WebSocket handshake, so this only
        turns away non-browser clients; leave it false when servers or apps that
        omit Origin must reach the API.
      default: false

  required:
    - allowedOrigins
  # With rejectDisallowedOrigins, every allowed origin must be a bare
  # scheme://host[:port] (or a subdomain wildcard), so "*", "null", paths and
  # trailing slashes are refused when the API is deployed rather than when the
  # policy is first loaded.
  if:
    properties:
      rejectDisallowedOrigins:
        const: true
    required:
      - rejectDisallowedOrigins
  then:
    properties:
      allowedOrigins:
        items:
          pattern: '^https?://(\*\.)?[^/?#@\s*]+$'

systemParameters:
  type: object
  properties: {}
