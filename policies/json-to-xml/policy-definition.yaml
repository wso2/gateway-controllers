name: json-to-xml
version: v0.1.0
description: |
  Transforms JSON payloads to XML in request and response mediation flows.
  Requires valid JSON input; non-JSON payloads fail policy execution.
  Do not attach this policy multiple times to the same resource flow.

parameters:
  type: object
  additionalProperties: false
  properties:
    onRequestFlow:
      type: boolean
      default: false
      description: |
        Converts incoming JSON request payloads to XML before forwarding upstream.
    onResponseFlow:
      type: boolean
      default: false
      description: |
        Converts outgoing JSON response payloads to XML before returning to clients.

systemParameters:
  type: object
  properties: {}
