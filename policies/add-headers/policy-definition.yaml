name: add-headers
version: v0.1.1
description: |
  Adds headers to the request and/or response.
  If a header already exists, new values are appended instead of overwritten.

parameters:
  type: object
  properties:
    requestHeaders:
      type: array
      description: Request headers to add during the request phase. At least
        one of requestHeaders or responseHeaders must be specified.
      minItems: 1
      items:
        type: object
        properties:
          name:
            type: string
            description: Header name (case-insensitive)
            minLength: 1
            maxLength: 256
            pattern: "^[a-zA-Z0-9-_]+$"
          value:
            type: string
            description: Header value
            maxLength: 8192
        required:
        - name
        - value
        resolve:
        - value
    responseHeaders:
      type: array
      description: Response headers to add during the response phase. At
        least one of requestHeaders or responseHeaders must be specified.
      minItems: 1
      items:
        type: object
        properties:
          name:
            type: string
            description: Header name (case-insensitive)
            minLength: 1
            maxLength: 256
            pattern: "^[a-zA-Z0-9-_]+$"
          value:
            type: string
            description: Header value
            maxLength: 8192
        required:
        - name
        - value
        resolve:
        - value
  anyOf:
    - required: [requestHeaders]
    - required: [responseHeaders]

systemParameters:
  type: object
  properties: {}
