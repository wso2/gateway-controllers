# No retries, so a failing introspection endpoint answers within the request timeout.
[policy_configurations.opaquetokenauth_v1]
introspectionretrycount = 0
introspectiontimeout = "3s"

# The testbench echo service answers POST /introspect with its request reflection, which has no
# "active" member, so every token it is asked about is inactive.
[[policy_configurations.opaquetokenauth_v1.introspectionproviders]]
name = "compat-inactive"

[policy_configurations.opaquetokenauth_v1.introspectionproviders.introspection]
uri = "http://testbench:3002/introspect"
