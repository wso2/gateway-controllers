name: word-count-guardrail
version: v0.1.0
description: |
  Validates word count in request and response content.
  Supports min/max limits, JSONPath extraction, and optional inverted matching.
  Request and response phases are configured independently.

parameters:
  type: object
  properties:
    request:
      type: object
      description: Request-phase configuration.
      properties:
        min:
          type: integer
          description: Minimum allowed word count (inclusive)
          minimum: 0
        max:
          type: integer
          description: Maximum allowed word count (inclusive)
          minimum: 1
        jsonPath:
          type: string
          description: |
            JSONPath to extract a specific value from the JSON payload.
            If empty, validates the entire payload.
            Examples: "$.message", "$.data.content", "$.items[0].text"
          default: ""
        invert:
          type: boolean
          description: |
            If true, validation passes when word count is NOT within the min-max range (inverted logic).
            If false (default), validation passes when word count is within the min-max range.
          default: false
        showAssessment:
          type: boolean
          description: Controls assessment detail level in error responses.
          default: false
      required:
      - min
      - max
    response:
      type: object
      description: Response-phase configuration.
      properties:
        min:
          type: integer
          description: Minimum allowed word count (inclusive)
          minimum: 0
        max:
          type: integer
          description: Maximum allowed word count (inclusive)
          minimum: 1
        jsonPath:
          type: string
          description: |
            JSONPath to extract a specific value from the JSON payload.
            If empty, validates the entire payload.
            Examples: "$.message", "$.data.content", "$.items[0].text"
          default: ""
        invert:
          type: boolean
          description: |
            If true, validation passes when word count is NOT within the min-max range (inverted logic).
            If false (default), validation passes when word count is within the min-max range.
          default: false
        showAssessment:
          type: boolean
          description: Controls assessment detail level in error responses.
          default: false
      required:
      - min
      - max
  anyOf:
  - required:
    - request
  - required:
    - response

systemParameters:
  type: object
  properties: {}
