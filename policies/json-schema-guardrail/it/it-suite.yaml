# The integration suite of the json-schema-guardrail policy. Feature paths are relative to this
# directory. Give a runner a tags entry, "gateway-version>=X.Y.Z", only when the policy needs a
# gateway release newer than the oldest one tested.

suite: json-schema-guardrail

defaults:
  parallel: 1
  components:
    platform-gateway:
      db: sqlite
      dbCompatibility:
        sqlserver: "gateway-version>=1.2.0"
  timeouts:
    boot: 5m
    propagation: 60s

blocks:
  # The runners create their own uniquely named APIs and run at the same time.
  - name: json-schema-guardrail
    parallel: 4
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: json-schema-guardrail
        features:
          - features/json_schema_guardrail.feature
      - name: json-schema-guardrail-schema-keywords
        features:
          - features/json_schema_guardrail_schema_keywords.feature
      - name: json-schema-guardrail-response
        features:
          - features/json_schema_guardrail_response.feature
      - name: json-schema-guardrail-api-lifecycle
        features:
          - features/json_schema_guardrail_api_lifecycle.feature

  # The restart runner restarts gateway services, which would interrupt any runner beside it, so it
  # gets a block of its own.
  - name: json-schema-guardrail-restart
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
    runners:
      - name: json-schema-guardrail-restart
        features:
          - features/json_schema_guardrail_restart.feature
