name: openai-to-mistral-transformer
version: v0.10.1
description: |
  Adapts OpenAI Chat Completions requests for Mistral-compatible upstreams by
  resolving the model, stripping unsupported fields, and rewriting the request
  path. Mistral-compatible responses are passed back in OpenAI shape.

  Mistral already answers in OpenAI shape, so streaming responses are forwarded
  event for event rather than rewritten, which keeps delivery incremental. A
  response that is not an event stream is reassembled before translation, so a
  body the upstream framed as chunked — an error envelope, or any JSON reply
  sent without a content-length — is still translated rather than passed
  through untouched. Supports routed and unconditional execution modes.

parameters:
  type: object
  additionalProperties: false
  properties:
    model:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        Fallback Mistral model name (for example mistral-large-latest), used
        only when the request payload names no model. It does not override a
        model the client named.
      minLength: 1
    providerId:
      type: string
      x-wso2-policy-advanced-param: false
      description: |
        Provider this translator targets. Used as the upstream cluster name
        (matching an id or as alias in the LlmProxy additionalProviders list) and, in
        multi-provider mode, as the key matched (case-insensitive) against
        SharedContext.Metadata["selected_provider"]. When no provider has been
        selected upstream (single-provider proxy), the translator always runs;
        when a provider has been selected, it runs only if the selection
        matches this provider id. When omitted, routing is left to the route's
        default upstream.
      minLength: 1

systemParameters:
  type: object
  properties: {}
