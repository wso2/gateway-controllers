name: Gateway Controller Policy Integration Test

on:
  workflow_dispatch:
    inputs:
      policies:
        description: "Comma-separated policies to test, or 'all' for every policy with integration tests"
        required: true
        default: all
      block_parallel:
        description: "Most blocks that boot at the same time across the selected suites; empty uses the IT_BLOCK_PARALLEL variable, then the Makefile default; 0 runs one suite at a time"
        required: false
        default: ""
  pull_request:
    branches:
      - main
    paths:
      - 'policies/**'
      - 'tests/it/**'
      - 'scripts/it/**'
      - 'Makefile'
      - '.github/workflows/it.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  detect:
    name: Select policies
    runs-on: ubuntu-24.04
    outputs:
      policies: ${{ steps.select.outputs.policies }}
      has_tests: ${{ steps.select.outputs.has_tests }}
    steps:
      - name: Checkout gateway-controllers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the policies to test
        id: select
        env:
          REQUESTED_POLICIES: ${{ inputs.policies }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 scripts/it/test_changed_policies.py
          python3 scripts/it/test_scaffold.py
          if [[ -n "$REQUESTED_POLICIES" ]]; then
            python3 scripts/it/changed-policies.py --policies "$REQUESTED_POLICIES"
          else
            python3 scripts/it/changed-policies.py --base "$BASE_SHA"
          fi

  standards:
    name: Step and feature standards
    needs: detect
    if: needs.detect.outputs.has_tests == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout gateway-controllers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: gateway-controllers
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            gateway-controllers/tests/it/go.sum
            gateway-controllers/policies/*/it/go.sum

      - name: Check the shared steps and the changed policies' suites against the framework standards
        working-directory: gateway-controllers
        env:
          POLICIES: ${{ needs.detect.outputs.policies }}
        run: make it-standards POLICIES="$POLICIES"

  integration-test:
    name: Gateway Integration (${{ matrix.gateway_version }})
    needs: detect
    if: needs.detect.outputs.has_tests == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - gateway_version: "1.2.0"
          - gateway_version: "1.1.0"
            gateway_host: docker.io/isurangaws
          - gateway_version: "latest"

    steps:
      - name: Checkout gateway-controllers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: gateway-controllers
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: |
            gateway-controllers/tests/it/go.sum
            gateway-controllers/policies/*/it/go.sum

      # The suite's database matrix boots several short-lived containers and
      # published ports. Under concurrent connection churn, the default
      # conntrack table can fill and cause intermittent connection failures.
      - name: Raise the conntrack table limit
        run: sudo sysctl -w net.netfilter.nf_conntrack_max=524288

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # One run per gateway version builds the gateway once, from every policy of the repository on
      # the base images of that version, then executes the suite of every selected policy in turn
      # against that build and fails if any of them fails.
      # The suites run on the testbench image published with the pinned framework release. Pull it
      # when this repository can, and otherwise build the same image from the pinned module's
      # source, which is what the release publishes.
      - name: Provide the testbench image
        working-directory: gateway-controllers/tests/it
        run: |
          set -euo pipefail
          module=github.com/wso2/api-platform/tests/framework
          go mod download "$module"
          version="$(go list -m -f '{{.Version}}' "$module")"
          image="ghcr.io/wso2/api-platform/testbench:${version#v}"
          if docker pull "$image"; then
            exit 0
          fi
          dir="$(go list -m -f '{{.Dir}}' "$module")"
          docker build -f "$dir/testbench/Dockerfile" -t "$image" "$dir"

      - name: Run the integration suites of the selected policies
        working-directory: gateway-controllers
        shell: bash
        env:
          GATEWAY_VERSION: ${{ matrix.gateway_version }}
          GATEWAY_HOST: ${{ matrix.gateway_host }}
          POLICIES: ${{ needs.detect.outputs.policies }}
          BLOCK_PARALLEL: ${{ inputs.block_parallel || vars.IT_BLOCK_PARALLEL }}
        run: |
          set -euo pipefail
          # Record the runner's memory and load while the suites run, to choose BLOCK_PARALLEL from.
          usage="$GITHUB_WORKSPACE/resource-usage-$GATEWAY_VERSION.log"
          (while true; do
            echo "$(date -u +%H:%M:%S) $(free -m | awk '/^Mem:/ {print "used_mb=" $3 " available_mb=" $7}') load=$(cut -d' ' -f1-3 /proc/loadavg) containers=$(docker ps -q | wc -l)"
            sleep 10
          done) >> "$usage" &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          make it POLICIES="$POLICIES" GATEWAY_VERSION="$GATEWAY_VERSION" GATEWAY_HOST="$GATEWAY_HOST" \
            ${BLOCK_PARALLEL:+BLOCK_PARALLEL="$BLOCK_PARALLEL"} 2>&1 | tee "$GITHUB_WORKSPACE/policy-it-$GATEWAY_VERSION.log"

      - name: Upload the test output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gateway-controller-policy-test-output-${{ matrix.gateway_version }}
          path: |
            policy-it-${{ matrix.gateway_version }}.log
            resource-usage-${{ matrix.gateway_version }}.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump Docker diagnostics on failure
        if: failure()
        shell: bash
        env:
          GATEWAY_VERSION: ${{ matrix.gateway_version }}
        run: |
          set +e
          diagnostics_dir="$GITHUB_WORKSPACE/docker-diagnostics-$GATEWAY_VERSION"
          mkdir -p "$diagnostics_dir"

          echo "=== Docker Containers ==="
          docker ps -a | tee "$diagnostics_dir/containers.txt"

          echo "=== Docker Logs ==="
          docker ps -aq | while read -r container_id; do
            container_name="$(docker inspect --format '{{.Name}}' "$container_id" | sed 's#^/##; s#[^A-Za-z0-9_.-]#_#g')"
            {
              echo "=== $container_name ($container_id) ==="
              docker logs "$container_id" 2>&1
              echo
            } >> "$diagnostics_dir/containers.log"
          done

      - name: Upload Docker diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gateway-controller-policy-docker-diagnostics-${{ matrix.gateway_version }}
          path: docker-diagnostics-${{ matrix.gateway_version }}
          if-no-files-found: ignore
          retention-days: 7
