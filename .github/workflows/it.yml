name: Gateway Controller Policy Integration Test

on:
  workflow_dispatch:
    inputs:
      policies:
        description: "Comma-separated policies to test (a major version beside v1 is <name>/v<N>, e.g. backend-jwt/v2), or 'all' for every policy with integration tests"
        required: true
        default: all
      block_parallel:
        description: "Most blocks that run at the same time across the selected suites; empty uses the IT_BLOCK_PARALLEL variable, then the Makefile default"
        required: false
        default: ""
  pull_request:
    branches:
      - main
    paths:
      - 'policies/**'
      - 'tests/it/**'
      - 'scripts/it/**'
      - 'scripts/coverage/**'
      - 'codecov.yml'
      - 'Makefile'
      - '.github/workflows/it.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  detect:
    name: Select policies
    runs-on: ubuntu-24.04
    outputs:
      policies: ${{ steps.select.outputs.policies }}
      has_tests: ${{ steps.select.outputs.has_tests }}
    steps:
      - name: Checkout gateway-controllers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select the policies to test
        id: select
        env:
          REQUESTED_POLICIES: ${{ inputs.policies }}
        run: |
          set -euo pipefail
          python3 scripts/it/test_changed_policies.py
          python3 scripts/it/test_scaffold.py
          python3 scripts/it/test_check_framework_pin.py
          python3 scripts/it/test_generate_workspace.py
          python3 scripts/it/test_render_timeline.py
          python3 scripts/coverage/test_summarize_coverage.py
          python3 scripts/coverage/test_own_suite_profile.py
          make validate-codecov-config
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            python3 scripts/it/changed-policies.py --policies all
          else
            python3 scripts/it/changed-policies.py --policies "$REQUESTED_POLICIES"
          fi

  standards:
    name: Step and feature standards
    needs: detect
    if: needs.detect.outputs.has_tests == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout gateway-controllers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: gateway-controllers
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            gateway-controllers/tests/it/go.sum
            gateway-controllers/policies/*/it/go.sum
            gateway-controllers/policies/*/v*/it/go.sum

      - name: Check the shared steps and the selected policies' suites against the framework standards
        working-directory: gateway-controllers
        env:
          POLICIES: ${{ needs.detect.outputs.policies }}
        run: make it-standards POLICIES="$POLICIES"

  integration-test:
    name: Gateway Integration (${{ matrix.gateway_version }})
    needs: detect
    if: needs.detect.outputs.has_tests == 'true'
    runs-on: ubuntu-24.04
    # Job-level permissions replace the workflow's, so contents is repeated. packages: read lets
    # GITHUB_TOKEN pull the testbench image from GHCR.
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - gateway_version: "1.2.0"
          - gateway_version: "1.1.0"
            gateway_host: docker.io/isurangaws
          # The latest gateway is the one whose policy engine can be built with coverage, so this leg
          # also reports the coverage of the policies (see "Policy code coverage" in tests/it/CLAUDE.md).
          - gateway_version: "latest"
            coverage: true

    steps:
      - name: Checkout gateway-controllers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: gateway-controllers
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            gateway-controllers/tests/it/go.sum
            gateway-controllers/policies/*/it/go.sum
            gateway-controllers/policies/*/v*/it/go.sum

      # The suite's database matrix boots several short-lived containers and
      # published ports. Under concurrent connection churn, the default
      # conntrack table can fill and cause intermittent connection failures.
      - name: Raise the conntrack table limit
        run: sudo sysctl -w net.netfilter.nf_conntrack_max=524288

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # Pulling a private GHCR image needs credentials; docker pull sends none unless logged in.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One run per gateway version builds the gateway once, from every policy of the repository on
      # the base images of that version, then executes the suite of every selected policy in turn
      # against that build and fails if any of them fails.
      # The suites run on the testbench image published with the framework release that
      # tests/it/go.mod pins, the one version every suite shares. Pull it
      # when this repository can, and otherwise build the image from the pinned module's source,
      # which has the testbench of the release, not of a later rebuild of its published image.
      - name: Provide the testbench image
        working-directory: gateway-controllers/tests/it
        run: |
          set -euo pipefail
          module=github.com/wso2/api-platform/tests/framework
          go mod download "$module"
          version="$(go list -m -f '{{.Version}}' "$module")"
          image="ghcr.io/wso2/api-platform/testbench:${version#v}"
          if docker pull "$image"; then
            exit 0
          fi
          echo "::warning::Could not pull $image; building it from the pinned module source instead"
          dir="$(go list -m -f '{{.Dir}}' "$module")"
          docker build -f "$dir/testbench/Dockerfile" -t "$image" "$dir"

      - name: Run the integration suites of the selected policies
        working-directory: gateway-controllers
        shell: bash
        env:
          GATEWAY_VERSION: ${{ matrix.gateway_version }}
          GATEWAY_HOST: ${{ matrix.gateway_host }}
          POLICIES: ${{ needs.detect.outputs.policies }}
          BLOCK_PARALLEL: ${{ inputs.block_parallel || vars.IT_BLOCK_PARALLEL }}
          IT_TIMELINE: ${{ github.workspace }}/it-timeline-${{ matrix.gateway_version }}.json
          # Set on the coverage leg only: builds the gateway with every policy instrumented and
          # collects the counters of the runs there.
          IT_COVERAGE_DIR: ${{ matrix.coverage && 'coverage/raw' || '' }}
        run: |
          set -euo pipefail
          # Record the runner's memory and load while the suites run, to choose BLOCK_PARALLEL from.
          usage="$GITHUB_WORKSPACE/resource-usage-$GATEWAY_VERSION.log"
          (while true; do
            echo "$(date -u +%H:%M:%S) $(free -m | awk '/^Mem:/ {print "used_mb=" $3 " available_mb=" $7}') load=$(cut -d' ' -f1-3 /proc/loadavg) containers=$(docker ps -q | wc -l)"
            sleep 10
          done) >> "$usage" &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          make it POLICIES="$POLICIES" GATEWAY_VERSION="$GATEWAY_VERSION" GATEWAY_HOST="$GATEWAY_HOST" \
            ${BLOCK_PARALLEL:+BLOCK_PARALLEL="$BLOCK_PARALLEL"} IT_TIMELINE="$IT_TIMELINE" \
            ${IT_COVERAGE_DIR:+IT_COVERAGE_DIR="$IT_COVERAGE_DIR"} \
            2>&1 | tee "$GITHUB_WORKSPACE/policy-it-$GATEWAY_VERSION.log"

      # The time each policy suite took on this gateway version, in the run summary. It is best
      # effort and never fails the job.
      - name: Summarize the suite timing
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GATEWAY_VERSION: ${{ matrix.gateway_version }}
        run: |
          python3 gateway-controllers/scripts/it/render-timeline.py \
            --input "$GITHUB_WORKSPACE/it-timeline-$GATEWAY_VERSION.json" >> "$GITHUB_STEP_SUMMARY"

      # The coverage of the policies on this leg, taken from the counters the suites collected. The
      # steps below only report: they never fail the job, which the suites and their collection above
      # decide. Each policy is credited with the runs of its own suite alone.
      - name: Merge the coverage of the suites
        if: always() && matrix.coverage
        id: coverage
        continue-on-error: true
        working-directory: gateway-controllers
        run: scripts/coverage/it-coverage-report.sh coverage/raw coverage

      - name: Summarise policy-wise and global coverage
        if: always() && matrix.coverage && steps.coverage.outcome == 'success'
        continue-on-error: true
        working-directory: gateway-controllers
        run: python3 scripts/coverage/summarize-coverage.py coverage/coverage.txt | tee -a "$GITHUB_STEP_SUMMARY"

      # The text of the pull request comment: the global figure, the policies under the minimum and
      # the full per-policy table. It is only written here and handed to the comment job below as a
      # file, so that the job holding the write permission runs no code of the pull request. A pull
      # request from a fork gets a read-only token and no comment; Codecov's own comment (see
      # `comment` in codecov.yml, which needs the Codecov app and CODECOV_TOKEN) is its report.
      - name: Prepare the pull request comment
        id: comment
        if: >-
          always() && matrix.coverage && steps.coverage.outcome == 'success'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        working-directory: gateway-controllers
        run: |
          mkdir -p coverage/comment
          { echo '<!-- policy-code-coverage -->'; python3 scripts/coverage/summarize-coverage.py --collapse coverage/coverage.txt; } > coverage/comment/comment.md

      - name: Upload the pull request comment
        if: always() && steps.comment.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-comment
          path: gateway-controllers/coverage/comment/comment.md
          retention-days: 1

      - name: Warn when the Codecov token is missing
        if: always() && matrix.coverage && steps.coverage.outcome == 'success'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "::warning::CODECOV_TOKEN is not available, so the Codecov upload is rejected and Codecov posts no pull request comment. Add the CODECOV_TOKEN secret and install the Codecov app on this repository (pull requests from forks never receive the secret)."
          fi

      # The report is one file holding every policy; Codecov splits it into per-policy
      # components by path. Listed explicitly, with search off, so that only this report is
      # uploaded. The checkout is in a subfolder, which is where Codecov finds the repository.
      - name: Upload coverage to Codecov
        if: always() && matrix.coverage && steps.coverage.outcome == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: gateway-controllers
          disable_search: true
          files: coverage/coverage.txt
          flags: integration
          fail_ci_if_error: false

      - name: Upload the test output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gateway-controller-policy-test-output-${{ matrix.gateway_version }}
          path: |
            policy-it-${{ matrix.gateway_version }}.log
            resource-usage-${{ matrix.gateway_version }}.log
            it-timeline-${{ matrix.gateway_version }}.json
            gateway-controllers/coverage/coverage.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump Docker diagnostics on failure
        if: failure()
        shell: bash
        env:
          GATEWAY_VERSION: ${{ matrix.gateway_version }}
        run: |
          set +e
          diagnostics_dir="$GITHUB_WORKSPACE/docker-diagnostics-$GATEWAY_VERSION"
          mkdir -p "$diagnostics_dir"

          echo "=== Docker Containers ==="
          docker ps -a | tee "$diagnostics_dir/containers.txt"

          echo "=== Docker Logs ==="
          docker ps -aq | while read -r container_id; do
            container_name="$(docker inspect --format '{{.Name}}' "$container_id" | sed 's#^/##; s#[^A-Za-z0-9_.-]#_#g')"
            {
              echo "=== $container_name ($container_id) ==="
              docker logs "$container_id" 2>&1
              echo
            } >> "$diagnostics_dir/containers.log"
          done

      - name: Upload Docker diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gateway-controller-policy-docker-diagnostics-${{ matrix.gateway_version }}
          path: docker-diagnostics-${{ matrix.gateway_version }}
          if-no-files-found: ignore
          retention-days: 7

  # Posts the comment prepared by the coverage leg. It checks out nothing and runs no code of the
  # pull request: it downloads one text file and sends it with the gh CLI, so the
  # pull-requests: write token it holds is out of reach of the pull request. It runs only for a pull
  # request from this repository; a fork's token cannot write.
  coverage-comment:
    name: Coverage pull request comment
    needs: integration-test
    if: >-
      always() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      # The comment exists only when the coverage leg got as far as writing it.
      - name: Download the comment
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-comment

      # One comment per pull request, updated in place. Only the bot's own comment is ever
      # updated: a comment by anyone else that starts with the marker is ignored.
      - name: Post or update the comment
        if: hashFiles('comment.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- policy-code-coverage -->'
          id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@comment.md > /dev/null
          fi
