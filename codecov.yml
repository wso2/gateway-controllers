# Codecov configuration for the gateway-controllers (policy hub) repository.
#
# Every policy is a Go module of its own, so coverage is reported per policy: one Codecov
# component per policy (and one per major version released beside v1). Codecov rolls the
# components up into the repository-wide figure it reports as the global coverage.
#
# The coverage is that of the integration suites (policies/*/it): the gateway is built with every
# policy's code instrumented, the suites run against it, and the counters are uploaded under the
# `integration` flag. A policy without an integration suite reports 0%.
#
# The component list below is generated from the policy modules under policies/. Run
# `make generate-codecov-config` after adding or removing a policy; CI runs
# `make validate-codecov-config` and fails when the list is out of date.

# Maps Go module import paths in coverage profiles to repository paths, so Codecov can
# attach coverage to real files. Profiles carry paths like
# github.com/wso2/gateway-controllers/policies/basic-auth/basicauth.go
fixes:
  - "github.com/wso2/gateway-controllers/::"

# The integration suites (policies/*/it, tests/it) are test code, not policy code.
ignore:
  - "policies/**/it/**"
  - "tests/**"

# One upload carries the integration-test coverage of every policy (the workflow sets disable_search).
# Carry the last known report forward if a run uploads nothing, instead of reading that
# absence as lost coverage.
flag_management:
  default_rules:
    carryforward: true

# Repository-wide (global) coverage. Informational while the report is being rolled out:
# the checks report the figure on the pull request without blocking the merge. Remove
# `informational: true` to make a check gate merges.
coverage:
  status:
    project:
      default:
        target: auto
        informational: true
    patch:
      default:
        target: auto
        informational: true

# The pull request comment: the diff coverage, then the per-policy table (components).
comment:
  layout: "header, diff, components, files, footer"
  require_changes: false

# Per-policy coverage, grouped by path. Each component gets its own project/patch status
# (codecov/project/<policy>, codecov/patch/<policy>), also informational for now.
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        informational: true
      - type: patch
        target: auto
        informational: true
  individual_components:
